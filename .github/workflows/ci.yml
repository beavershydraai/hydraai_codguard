name: CI

# Every PR must pass the "CI result" check before review is requested.
# review-gate.yml removes review requests made while this check is not green.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but never cancel a deploy on main halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Shared by the deploy jobs (main only).
env:
  GCP_PROJECT_ID: ai-codguard
  GCP_REGION: asia-southeast1
  GCP_WIF_PROVIDER: projects/186430269525/locations/global/workloadIdentityPools/github/providers/github-oidc
  GCP_DEPLOYER_SA: codguard-deployer@ai-codguard.iam.gserviceaccount.com

jobs:
  backend:
    name: Backend (lint, tests, API contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes no major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (includes API contract checks)
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6  # reads the version from packageManager in package.json
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: API client matches api/openapi.yaml
        run: |
          pnpm generate:api
          if [ -n "$(git status --porcelain src/api/gen)" ]; then
            git status --short src/api/gen
            echo "::error::src/api/gen is out of date. Run 'pnpm generate:api' in frontend/ and commit the result."
            exit 1
          fi
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  image:
    name: Backend image (build, smoke test, publish on main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/backend
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ env.PUBLISH }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max
      - name: Smoke test
        run: bash .github/scripts/smoke_test_image.sh "${{ env.IMAGE }}:sha-${GITHUB_SHA::7}"
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          docker push --all-tags "$IMAGE"
          echo "Published $IMAGE:sha-${GITHUB_SHA::7} and $IMAGE:main" >> "$GITHUB_STEP_SUMMARY"

  web-image:
    name: Frontend image (build, smoke test, publish on main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/frontend
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ env.PUBLISH }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,scope=frontend-image,mode=max
      - name: Smoke test
        run: bash .github/scripts/smoke_test_web.sh "${{ env.IMAGE }}:sha-${GITHUB_SHA::7}"
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          docker push --all-tags "$IMAGE"
          echo "Published $IMAGE:sha-${GITHUB_SHA::7} and $IMAGE:main" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy backend to Cloud Run (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, image, secrets, privacy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write # Workload Identity Federation: no GCP key is stored in GitHub
    env:
      GCP_RUNTIME_SA: codguard-runtime@ai-codguard.iam.gserviceaccount.com
      GCP_TRAINER_SA: codguard-trainer@ai-codguard.iam.gserviceaccount.com
      SERVICE: codguard-api
      DATA_ENV: FIRESTORE_DATABASE=vn-synthetic,MODEL_BUCKET=ai-codguard-ml
      # Gemini through Vertex AI as the runtime service account (no API key). This model is served
      # only from the global location, not asia-southeast1.
      GEMINI_ENV: GEMINI_MODEL=gemini-3.1-flash-lite,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=ai-codguard,GOOGLE_CLOUD_LOCATION=global
      # Temporary demo sign-in for testing; replace with Firebase Auth (E7.1) and remove before submission.
      DEMO_ADMIN_USERNAME: admin@gmail.com
      DEMO_ADMIN_PASSWORD: admin1234
      # The shop the sign-in account and the order simulator (app/demo/simulate.py) use.
      APP_ENV: ADMIN_SHOP_ID=shop_demo
      # AI calls (docs/call-controller.md): jobs go to Pub/Sub for the controller on the Asterisk
      # VM. An order whose phone is on CALL_ALLOWED_PHONES (the team's) rings that phone through
      # Twilio; every other call rings CALL_TARGET_OVERRIDE (`sip:6001`, the softphone). Both come
      # from Secret Manager below, so no team phone number is in the repo. Other buyers' phones
      # are never dialled (CALL_DIAL_BUYERS is not set).
      CALLS_ENV: CALL_JOBS_TOPIC=projects/ai-codguard/topics/call-jobs,CALL_ENV=demo,INTERNAL_AUDIENCE=https://codguard-api-186430269525.asia-southeast1.run.app,CONTROLLER_SERVICE_ACCOUNTS=codguard-runtime@ai-codguard.iam.gserviceaccount.com
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}/backend
    steps:
      - uses: actions/checkout@v7
      - name: Image names
        run: |
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/codguard/backend:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the tested image to Artifact Registry
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker pull "$SOURCE_IMAGE:$TAG"
          docker tag "$SOURCE_IMAGE:$TAG" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
          # The Asterisk VM runs the call controller from this image and pulls the "main" tag.
          docker tag "$SOURCE_IMAGE:$TAG" "${TARGET_IMAGE%:*}:main"
          docker push "${TARGET_IMAGE%:*}:main"
      - name: Firestore indexes
        run: |
          # Creates the composite indexes in infra/firestore.indexes.json that the database lacks.
          # A query that needs a missing index fails, and the API answers 500.
          database=$(tr ',' '\n' <<<"$DATA_ENV" | sed -n 's/^FIRESTORE_DATABASE=//p')
          python3 .github/scripts/sync_firestore_indexes.py infra/firestore.indexes.json \
            "$GCP_PROJECT_ID" "$database"
      - name: Deploy
        run: |
          # A new token signing key on every deploy: never in the repo, and every instance of one
          # revision shares it. Users sign in again after a deploy.
          AUTH_TOKEN_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$AUTH_TOKEN_SECRET"
          # CALL_TARGET_OVERRIDE used to be a plain variable; it is dropped as one before it is
          # set from its secret (gcloud applies env var changes first), so a re-run is a no-op.
          gcloud run deploy "$SERVICE" --image "$TARGET_IMAGE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SA" --allow-unauthenticated \
            --port 8080 --cpu 1 --memory 512Mi --min-instances 0 --max-instances 2 \
            --update-env-vars "$DATA_ENV,$GEMINI_ENV,$APP_ENV,$CALLS_ENV,AUTH_TOKEN_SECRET=$AUTH_TOKEN_SECRET" \
            --update-env-vars "ADMIN_USERNAME=$DEMO_ADMIN_USERNAME,ADMIN_PASSWORD=$DEMO_ADMIN_PASSWORD" \
            --remove-env-vars MODEL_URI,CALL_TARGET_OVERRIDE \
            --update-secrets "PHONE_HASH_KEY=phone-hash-key-synthetic:latest,PHONE_ENC_KEY=phone-enc-key-synthetic:latest,INTAKE_API_KEYS=intake-api-keys:latest,CALL_TARGET_OVERRIDE=call-target-override:latest,CALL_ALLOWED_PHONES=call-allowed-phones:latest" --quiet
          URL=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format 'value(status.url)')
          echo "URL=$URL" >> "$GITHUB_ENV"
      - name: Deploy the training and monitoring jobs
        run: |
          # Same image as the service; run on demand (train) or daily by Cloud Scheduler (monitor).
          for job in train monitor; do
            gcloud run jobs deploy "codguard-$job" --image "$TARGET_IMAGE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --service-account "$GCP_TRAINER_SA" --command python --args="-m,app.risk.jobs.$job" \
              --cpu 1 --memory 2Gi --task-timeout 30m --max-retries 0 \
              --set-env-vars "$DATA_ENV,RETRAIN_MODE=on_demand,REGION=$GCP_REGION" --quiet
          done
      - name: Deploy the order simulator job
        run: |
          # Runs only when executed, e.g. `gcloud run jobs execute codguard-simulate
          # --args=--minutes=10,--orders=60` (60 orders per country; `,--countries=SG` for one country,
          # `,--agents` to run the Gemini agents).
          gcloud run jobs deploy codguard-simulate --image "$TARGET_IMAGE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SA" --command "python,-m,app.demo.simulate" \
            --args="--minutes=60,--orders=10" \
            --cpu 1 --memory 512Mi --task-timeout 3h --max-retries 0 \
            --set-env-vars "INTAKE_URL=$URL" \
            --set-secrets "INTAKE_API_KEYS=intake-api-keys:latest" --quiet
      - name: Check the deployed service
        run: |
          echo "Deployed \`$TAG\` to $URL ([API docs]($URL/docs))" >> "$GITHUB_STEP_SUMMARY"
          for _ in $(seq 1 10); do
            curl -fsS "$URL/health" | grep -q '"ok"' && exit 0
            sleep 3
          done
          echo "::error::$URL/health did not return ok"
          curl -sS -i "$URL/health" | head -20
          exit 1
      - name: Check the demo sign-in
        run: |
          body=$(python3 -c 'import json, os; print(json.dumps({"username": os.environ["DEMO_ADMIN_USERNAME"], "password": os.environ["DEMO_ADMIN_PASSWORD"]}))')
          curl -fsS -X POST "$URL/api/v1/auth/login" -H 'Content-Type: application/json' -d "$body" \
            | grep -q '"access_token"' || { echo "::error::Sign-in with the demo account failed on $URL"; exit 1; }

  deploy-web:
    name: Deploy frontend to Cloud Run (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # After the backend deploy, so the app never runs ahead of the API it calls.
    needs: [frontend, web-image, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write # Workload Identity Federation: no GCP key is stored in GitHub
    env:
      # nginx needs no Google API access: its service account has no roles.
      GCP_WEB_SA: codguard-web@ai-codguard.iam.gserviceaccount.com
      SERVICE: codguard-web
      API_SERVICE: codguard-api
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}/frontend
    steps:
      - name: Image names
        run: |
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/codguard/frontend:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the tested image to Artifact Registry
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker pull "$SOURCE_IMAGE:$TAG"
          docker tag "$SOURCE_IMAGE:$TAG" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
      - name: Deploy
        run: |
          API_URL=$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format 'value(status.url)')
          gcloud run deploy "$SERVICE" --image "$TARGET_IMAGE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_WEB_SA" --allow-unauthenticated \
            --port 8080 --cpu 1 --memory 512Mi --min-instances 0 --max-instances 2 \
            --set-env-vars "API_ORIGIN=$API_URL" --quiet
          URL=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format 'value(status.url)')
          echo "URL=$URL" >> "$GITHUB_ENV"
      - name: Check the deployed app
        run: |
          echo "Deployed \`$TAG\` to $URL" >> "$GITHUB_STEP_SUMMARY"
          for _ in $(seq 1 10); do
            curl -fsS "$URL/" | grep -q 'id="root"' && break
            sleep 3
          done
          curl -fsS "$URL/" | grep -q 'id="root"' || { echo "::error::$URL/ did not return the app"; exit 1; }
          # A request the backend answers itself: 401 problem+json, not an nginx error page.
          result=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$URL/api/v1/me")
          case "$result" in
            "401 application/problem+json"*) ;;
            *) echo "::error::$URL/api/v1/me returned '$result'; /api is not reaching $API_SERVICE"; exit 1 ;;
          esac

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A new branch pushed to main has no "before" commit; scan everything then.
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="" ;; esac
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner ${RANGE:+--log-opts="$RANGE"} .

  privacy:
    name: No real phone numbers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked files
        run: python3 .github/scripts/check_phone_numbers.py

  ci-result:
    name: CI result
    if: always()
    needs: [backend, frontend, image, web-image, deploy, deploy-web, secrets, privacy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Withdraw review requests while CI is red
        if: github.event_name == 'pull_request' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const { data } = await github.rest.pulls.listRequestedReviewers({ owner, repo, pull_number: pr.number });
            const reviewers = data.users.map((u) => u.login);
            const team_reviewers = data.teams.map((t) => t.slug);
            if (reviewers.length + team_reviewers.length === 0) return;
            await github.rest.pulls.removeRequestedReviewers({ owner, repo, pull_number: pr.number, reviewers, team_reviewers });
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `CI failed on ${pr.head.sha.slice(0, 7)}, so the review request was withdrawn. Fix CI, then request review again.`,
            });
      - name: Verdict
        run: |
          echo 'Job results: ${{ toJSON(needs.*.result) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
