components:
  schemas:
    ActionCount:
      properties:
        action:
          $ref: '#/components/schemas/DecisionAction'
        count:
          type: integer
          minimum: 0.0
          title: Count
      additionalProperties: false
      type: object
      required:
      - action
      - count
      title: ActionCount
    Address:
      properties:
        raw:
          type: string
          maxLength: 500
          minLength: 3
          title: Raw
          examples:
          - Số 12 ngõ 34, phường Láng, Hà Nội
        street:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Street
          examples:
          - Số 12 ngõ 34
        ward:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Ward
          examples:
          - Phường Láng
        province:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Province
          examples:
          - Hà Nội
      additionalProperties: false
      type: object
      required:
      - raw
      title: Address
      description: |-
        Delivery address. `raw` is what the buyer wrote; the parsed parts are filled when known.
        Province and ward follow the 2025 two-level administrative units.
    BacktestResult:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
        dataset:
          type: string
          title: Dataset
        orders:
          type: integer
          minimum: 0.0
          title: Orders
        orders_per_day:
          type: integer
          minimum: 1.0
          title: Orders Per Day
          description: Shop size used for the savings estimate.
        failed_delivery_cost_vnd:
          type: integer
          minimum: 0.0
          title: Failed Delivery Cost Vnd
          description: Amount in VND (integer, no decimals).
        lift:
          items:
            $ref: '#/components/schemas/LiftSeries'
          type: array
          title: Lift
        comparison:
          items:
            $ref: '#/components/schemas/PolicyComparison'
          type: array
          title: Comparison
      additionalProperties: false
      type: object
      required:
      - generated_at
      - dataset
      - orders
      - orders_per_day
      - failed_delivery_cost_vnd
      - lift
      - comparison
      title: BacktestResult
      examples:
      - comparison:
        - contact_rate: 0
          failures_caught_rate: 0
          monthly_savings_vnd: 0
          policy: do_nothing
        - contact_rate: 1
          failures_caught_rate: 0.7
          monthly_savings_vnd: 9100000
          policy: call_everyone
        - contact_rate: 0.2
          failures_caught_rate: 0.63
          monthly_savings_vnd: 18300000
          policy: cod_guard
        dataset: public-ecommerce-cod-sample
        failed_delivery_cost_vnd: 60000
        generated_at: '2026-10-15T20:00:00+07:00'
        lift:
        - points:
          - contacted_share: 0.1
            failures_caught_share: 0.42
          - contacted_share: 0.2
            failures_caught_share: 0.63
          policy: cod_guard
        - points:
          - contacted_share: 0.1
            failures_caught_share: 0.21
          - contacted_share: 0.2
            failures_caught_share: 0.33
          policy: phone_history_only
        orders: 48000
        orders_per_day: 300
    Body_import_delivery_outcomes:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: CSV, UTF-8.
      type: object
      required:
      - file
      title: Body_import_delivery_outcomes
    Body_import_orders:
      properties:
