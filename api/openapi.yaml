      tags:
      - delivery
      summary: Record delivery outcomes (updates phone history)
      operationId: record_delivery_outcomes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryOutcomeBatch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryImportResult'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
      security:
      - bearerAuth: []
  /api/v1/delivery-outcomes/import:
    post:
      tags:
      - delivery
      summary: Import delivery outcomes from a CSV file
      operationId: import_delivery_outcomes
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_delivery_outcomes'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryImportResult'
        '400':
          description: Malformed request or file.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad request
                status: 400
                code: validation_error
                detail: CSV header is missing the buyer_phone column.
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
        '422':
