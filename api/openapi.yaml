          no_response_after_minutes: 120
          tier: medium
        - action: ai_call
          if_no_response: hold_for_review
          no_response_after_minutes: 30
          tier: high
        - action: require_deposit
          if_no_response: hold_for_review
          no_response_after_minutes: 1440
          tier: very_high
    ProblemDetail:
      properties:
        type:
          type: string
          title: Type
          default: about:blank
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        instance:
          anyOf:
          - type: string
          - type: 'null'
          title: Instance
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          title: Errors
          description: Set for validation_error.
        block_reasons:
          anyOf:
          - items:
              $ref: '#/components/schemas/ContactBlockReason'
            type: array
          - type: 'null'
          title: Block Reasons
          description: Set for contact_blocked.
      type: object
      required:
      - title
      - status
      - code
      title: ProblemDetail
      description: Error body (RFC 9457, `application/problem+json`).
    Reason:
      properties:
        text_vi:
          type: string
          maxLength: 200
          title: Text Vi
          examples:
          - This phone returned 2 of its 4 past orders.
        signal_keys:
          items:
            type: string
          type: array
          minItems: 1
          title: Signal Keys
          examples:
          - - phone_return_rate
      additionalProperties: false
      type: object
      required:
      - text_vi
      - signal_keys
      title: Reason
      description: |-
        A plain-English reason written by Gemini. Each reason cites the signals it is based on;
        reasons that do not match a real signal are rejected before they reach the API.
    RiskScore:
      properties:
        id:
          type: string
          title: Id
        scored_at:
          type: string
          format: date-time
          title: Scored At
        status:
          type: string
          enum:
          - scored
          - skipped
          title: Status
          description: skipped when a hard rule ends scoring early (e.g. fully prepaid order).
        skipped_reason:
          anyOf:
          - $ref: '#/components/schemas/HardRule'
          - type: 'null'
        probability:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Probability
          description: Probability of failed delivery.
        risk_score:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Risk Score
          description: probability × 100.
        tier:
          anyOf:
          - $ref: '#/components/schemas/RiskTier'
          - type: 'null'
        expected_loss_vnd:
          anyOf:
          - type: integer
            minimum: 0.0
            description: 'Amount in the order''s currency, as an integer in its minor unit: VND has none,
              SGD and PHP are in cents. Field names keep the `_vnd` suffix for compatibility.'
          - type: 'null'
          title: Expected Loss Vnd
          description: probability × failed_delivery_cost_vnd, in VND.
        failed_delivery_cost_vnd:
          type: integer
          minimum: 0.0
          title: Failed Delivery Cost Vnd
          description: Cost of one failed delivery used for this run (shop setting at the time).
        hard_rules:
          items:
            $ref: '#/components/schemas/HardRule'
          type: array
          title: Hard Rules
        top_signals:
          items:
            $ref: '#/components/schemas/Signal'
          type: array
          maxItems: 5
          title: Top Signals
        reasons:
          items:
            $ref: '#/components/schemas/Reason'
          type: array
          maxItems: 3
          title: Reasons
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
      additionalProperties: false
      type: object
      required:
      - id
      - scored_at
      - status
      - failed_delivery_cost_vnd
      title: RiskScore
      description: One scoring run. Editing an order before it ships creates a new run.
      examples:
      - expected_loss_vnd: 24600
        failed_delivery_cost_vnd: 60000
        hard_rules: []
        id: scr_01
        model_version: bqml-2026-10-09
        probability: 0.41
        reasons:
        - signal_keys:
          - phone_return_rate
          text_vi: This phone returned 2 of its 4 past orders.
        - signal_keys:
          - address_missing_house_number
          text_vi: The address is missing a house number.
        risk_score: 41
        scored_at: '2026-10-09T10:15:04+07:00'
        status: scored
        tier: high
        top_signals:
        - contribution: 0.18
          group: phone_history
          key: phone_return_rate
          label_vi: Return rate of the phone
          value: 0.5
        - contribution: 0.07
          group: address_quality
          key: address_missing_house_number
          label_vi: Address missing a house number
          value: true
    RiskTier:
      type: string
      enum:
      - low
      - medium
      - high
      - very_high
      title: RiskTier
      description: 'Risk tier. low: Low · medium: Medium · high: High · very_high: Very high'
    Role:
      type: string
      enum:
      - owner
      - staff
      title: Role
      description: 'Shop role. owner: Shop owner (can change the policy and costs) · staff: Staff'
    SalesChannel:
      type: string
      enum:
      - facebook
      - tiktok
      - zalo
      - website
      - other
      title: SalesChannel
      description: Where the order came from.
    Shop:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        created_at:
          type: string
          format: date-time
          title: Created At
        countries:
          items:
            $ref: '#/components/schemas/CountrySettings'
          type: array
          title: Countries
          description: One entry per country where the shop has branches (config/branches.yaml).
        intake_api_key_last4:
          anyOf:
          - type: string
          - type: 'null'
          title: Intake Api Key Last4
          description: Last 4 characters of the intake API key.
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - created_at
      - countries
      title: Shop
      examples:
      - countries:
        - ai_call_cost_vnd: 1500
          confirmation_link_cost_vnd: 300
          contact_hours:
            end: '21:00'
            start: 08:00
          country: VN
          currency: VND
          deposit_request_cost_vnd: 5000
          failed_delivery_cost_vnd: 60000
        - ai_call_cost_vnd: 30
          confirmation_link_cost_vnd: 2
          contact_hours:
            end: '20:00'
            start: 09:00
          country: SG
          currency: SGD
          deposit_request_cost_vnd: 200
          failed_delivery_cost_vnd: 1200
        created_at: '2026-10-09T09:00:00+07:00'
        id: shp_01
        intake_api_key_last4: a1b2
        name: Sample Fashion Shop
    ShopUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
        countries:
          anyOf:
          - items:
              $ref: '#/components/schemas/CountrySettingsUpdate'
            type: array
          - type: 'null'
          title: Countries
      additionalProperties: false
      type: object
      title: ShopUpdate
      description: Owner only. Fields left out are unchanged, and so are countries left out.
      examples:
      - countries:
        - country: VN
          failed_delivery_cost_vnd: 65000
    Signal:
      properties:
        key:
          type: string
          title: Key
          examples:
          - phone_return_rate
        group:
          $ref: '#/components/schemas/SignalGroup'
        label_vi:
          type: string
          title: Label Vi
          examples:
          - Return rate of the phone
        value:
          anyOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
          title: Value
          examples:
          - 0.5
        contribution:
          type: number
          title: Contribution
          description: Signed contribution to the failure probability. Positive raises risk.
          examples:
          - 0.18
      additionalProperties: false
      type: object
      required:
      - key
      - group
      - label_vi
      - value
      - contribution
      title: Signal
      description: One input signal and its contribution to this order's score (model explanation).
    SignalGroup:
      type: string
      enum:
      - phone_history
      - address_quality
      - order_behavior
      - conversation
      - velocity
      - context
      - payment
      title: SignalGroup
      description: |-
        Signal group. phone_history: Phone history · address_quality: Address quality ·
        order_behavior: Ordering behaviour · conversation: Sales conversation ·
        velocity: Unusual frequency · context: Context · payment: Payment
    SpamSimulationResult:
      properties:
        orders_created:
          type: integer
          minimum: 0.0
          title: Orders Created
        accounts:
          type: integer
          minimum: 0.0
          title: Accounts
        phone_masked:
          type: string
          title: Phone Masked
          description: Partially masked phone.
          examples:
          - +84******001
        contacts_made:
          type: integer
          minimum: 0.0
          title: Contacts Made
          description: 'Target: exactly 1.'
        phone_blocked:
          type: boolean
          title: Phone Blocked
      additionalProperties: false
      type: object
      required:
      - orders_created
      - accounts
      - phone_masked
      - contacts_made
      - phone_blocked
      title: SpamSimulationResult
      description: 'Abuse scenario: 50 fake orders from 20 accounts to one phone.'
      examples:
      - accounts: 20
        contacts_made: 1
        orders_created: 50
        phone_blocked: true
        phone_masked: +84******999
    TierPolicy:
      properties:
        tier:
          $ref: '#/components/schemas/RiskTier'
        action:
          $ref: '#/components/schemas/DecisionAction'
        if_no_response:
          anyOf:
          - $ref: '#/components/schemas/DecisionAction'
          - type: 'null'
          description: Escalation when the buyer does not respond.
        no_response_after_minutes:
          anyOf:
          - type: integer
            maximum: 2880.0
            minimum: 1.0
          - type: 'null'
          title: No Response After Minutes
      additionalProperties: false
      type: object
      required:
      - tier
      - action
      title: TierPolicy
    TranscriptTurn:
      properties:
        speaker:
          type: string
          enum:
          - agent
          - buyer
          title: Speaker
        text:
          type: string
          maxLength: 2000
          title: Text
        offset_ms:
          type: integer
          minimum: 0.0
          title: Offset Ms
          description: Milliseconds since the buyer answered.
      additionalProperties: false
      type: object
      required:
      - speaker
      - text
      - offset_ms
      title: TranscriptTurn
    Weekday:
      type: string
      enum:
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
      - sun
      title: Weekday
      description: Day of the week. mon · tue · wed · thu · fri · sat · sun
  securitySchemes:
    bearerAuth:
      type: http
      description: Access token of a shop user from `POST /api/v1/auth/login` (role owner or staff). Firebase
        ID tokens will replace it (E7.1).
      scheme: bearer
      bearerFormat: JWT
    intakeApiKey:
      type: apiKey
      description: Per-shop API key for external sales tools.
      in: header
      name: X-Api-Key
    googleIdToken:
      type: http
      description: Google-signed ID token of the call controller's service account (codguard-runtime),
        with the backend URL as audience. See docs/call-controller.md.
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Sign-in for the shop app.
- name: me
  description: Signed-in user.
- name: shop
  description: Shop settings and tier policy.
- name: orders
  description: Order inbox, order page, edits, overrides, manual calls.
- name: calls
  description: AI confirmation calls.
- name: delivery
  description: Delivery outcomes that update phone history.
- name: dashboard
  description: ROI dashboard and backtest.
- name: intake
  description: Order intake for external sales tools (API key).
- name: public
  description: Buyer confirmation page. No login; the link token is the credential.
- name: demo
  description: Demo controls for the hackathon. Not for production.
- name: internal
  description: Call controller on the Asterisk VM (service account only). See docs/call-controller.md.
servers:
- url: http://localhost:8080
  description: Local
