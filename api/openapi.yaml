        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or invalid Google ID token, or not a controller service account.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not found
                status: 404
                code: not_found
                detail: Order ord_99 not found.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Request conflicts with the current state. See `code`.
          content:
