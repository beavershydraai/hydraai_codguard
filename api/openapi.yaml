webhooks:
  call-job:
    post:
      tags:
      - internal
      summary: Call job on the Pub/Sub topic `call-jobs`
      description: 'Not an HTTP request: the backend publishes this body to the Pub/Sub topic `call-jobs`
        with the attributes `env`, `call_id`, `target_kind` and `agent`. The controller pulls it from
        its subscription, claims the call with `report_call_status` (`dialing`), then acks the message.'
      operationId: call_job
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallJob'
        required: true
      responses:
        '200':
          description: 'No HTTP response: the controller acks the message.'
components:
  schemas:
    ActionCount:
      properties:
        action:
          $ref: '#/components/schemas/DecisionAction'
        count:
          type: integer
          minimum: 0.0
          title: Count
      additionalProperties: false
      type: object
      required:
      - action
      - count
      title: ActionCount
    Address:
      properties:
        raw:
          type: string
          maxLength: 500
          minLength: 3
          title: Raw
          examples:
          - Số 12 ngõ 34, phường Láng, Hà Nội
        street:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Street
          examples:
          - Số 12 ngõ 34
        ward:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Ward
          examples:
          - Phường Láng
        province:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Province
          examples:
          - Hà Nội
      additionalProperties: false
      type: object
      required:
      - raw
      title: Address
      description: |-
        Delivery address. `raw` is what the buyer wrote; the parsed parts are filled when known.
        Province and ward follow the 2025 two-level administrative units.
    BacktestResult:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
        country:
          type: string
          title: Country
          description: Country of the model (VN, SG, PH).
          default: VN
        currency:
          type: string
          enum:
          - VND
          - SGD
          - PHP
          title: Currency
          description: Currency of every amount.
          default: VND
        dataset:
          type: string
          title: Dataset
        orders:
          type: integer
          minimum: 0.0
          title: Orders
        orders_per_day:
          type: integer
          minimum: 1.0
          title: Orders Per Day
          description: Shop size used for the savings estimate.
        failed_delivery_cost_vnd:
          type: integer
          minimum: 0.0
          title: Failed Delivery Cost Vnd
          description: 'Amount in the order''s currency, as an integer in its minor unit: VND has none,
            SGD and PHP are in cents. Field names keep the `_vnd` suffix for compatibility.'
        lift:
          items:
            $ref: '#/components/schemas/LiftSeries'
          type: array
          title: Lift
        comparison:
          items:
            $ref: '#/components/schemas/PolicyComparison'
          type: array
          title: Comparison
      additionalProperties: false
      type: object
      required:
      - generated_at
      - dataset
      - orders
      - orders_per_day
      - failed_delivery_cost_vnd
      - lift
      - comparison
      title: BacktestResult
      examples:
      - comparison:
        - contact_rate: 0
          failures_caught_rate: 0
          monthly_savings_vnd: 0
          policy: do_nothing
        - contact_rate: 1
          failures_caught_rate: 0.7
          monthly_savings_vnd: 9100000
          policy: call_everyone
        - contact_rate: 0.2
          failures_caught_rate: 0.63
          monthly_savings_vnd: 18300000
          policy: cod_guard
        dataset: public-ecommerce-cod-sample
        failed_delivery_cost_vnd: 60000
        generated_at: '2026-10-15T20:00:00+07:00'
        lift:
        - points:
          - contacted_share: 0.1
            failures_caught_share: 0.42
          - contacted_share: 0.2
            failures_caught_share: 0.63
          policy: cod_guard
