        gemini_live: Gemini Live (free conversation)
    CallAutomation:
      properties:
        mode:
          $ref: '#/components/schemas/CallAutomationMode'
          default: auto
        min_tier:
          anyOf:
          - $ref: '#/components/schemas/RiskTier'
          - type: 'null'
          description: 'Auto-call from this risk tier up; an AI call for a lower tier is only suggested.
            Which tiers get a call at all is the tier policy''s choice. Null: every tier.'
        cod_ranges:
          items:
            $ref: '#/components/schemas/CodRange'
          type: array
          title: Cod Ranges
          description: Per currency; a currency without a range is not limited.
        channels:
          anyOf:
          - items:
              $ref: '#/components/schemas/SalesChannel'
            type: array
          - type: 'null'
          title: Channels
          description: 'Sales channels to auto-call. Null: all.'
        call_window:
          anyOf:
          - $ref: '#/components/schemas/CallWindow'
          - type: 'null'
          description: 'Null: whenever contact hours allow.'
        max_attempts:
          type: integer
          maximum: 2.0
          minimum: 1.0
          title: Max Attempts
          description: AI calls the agent makes per order (at most 2).
          default: 2
        retry_after_minutes:
          type: integer
          maximum: 1440.0
          minimum: 30.0
          title: Retry After Minutes
          description: Wait before the next call (at least 30).
          default: 30
      additionalProperties: false
      type: object
      title: CallAutomation
      description: |-
        When the agent places an AI call by itself. The engine still scores every order and picks
        the action; an AI call outside these rules is not placed but suggested: the order waits in
        review with `suggested_action: ai_call` until the shop confirms the call
        (`POST /orders/{id}/calls`) or chooses something else. The defaults are the tier policy as it
        was: every call the engine picks is placed. Contact protection (contact hours, one call per
        phone per day, blocked phones) applies to every call on top of these rules.
      examples:
      - call_window:
          days:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          end: '20:00'
          start: 09:00
        channels:
        - facebook
        - tiktok
        - zalo
        cod_ranges:
        - currency: VND
          max_cod: 5000000
          min_cod: 200000
        max_attempts: 2
        min_tier: high
        mode: auto
        retry_after_minutes: 45
    CallAutomationMode:
      type: string
      enum:
      - auto
      - suggest
      title: CallAutomationMode
      description: |-
        Who starts an AI call the engine chooses.

        auto: the agent calls by itself when the order is inside the shop's automation rules ·
        suggest: the agent only suggests the call; the shop confirms it
