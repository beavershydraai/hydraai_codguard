openapi: 3.1.0
info:
  title: COD Guard API
  description: |-
    Contract between the COD Guard backend and its clients (shop web app, buyer confirmation page,
    external sales tools).

    Conventions:

    - Money is integer VND in fields ending `_vnd`.
    - Times are ISO 8601 with offset; shops operate in Vietnam time (`+07:00`).
    - Enum values are English snake_case. Each enum's description lists its Vietnamese UI labels.
    - Errors use `application/problem+json` (RFC 9457) with a machine-readable `code`.
    - Lists use cursor pagination: pass `next_cursor` back as `cursor`.
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in to the shop app
      description: 'Exchanges a username and password for a bearer access token valid for 12 hours. A
        stand-in for Firebase Auth (E7.1): the only account is the admin account configured on the server.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Wrong username or password.
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - password
                  msg: String should have at least 1 character
                  type: string_too_short
  /api/v1/me:
    get:
      tags:
      - me
      summary: Current user
      operationId: get_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
      security:
      - bearerAuth: []
  /api/v1/shop:
    get:
      tags:
      - shop
      summary: Current user's shop and settings
      operationId: get_shop
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
      security:
      - bearerAuth: []
    patch:
      tags:
      - shop
      summary: Update shop name or settings (owner only)
      operationId: update_shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
        '403':
          description: Authenticated but not allowed (e.g. staff changing policy).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                code: forbidden
                detail: Only the shop owner can change the policy.
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
      security:
      - bearerAuth: []
  /api/v1/shop/policy:
    get:
      tags:
      - shop
      summary: Tier policy in force
      operationId: get_policy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
      security:
      - bearerAuth: []
    put:
      tags:
      - shop
      summary: Replace the tier policy (owner only)
      description: Creates a new version. It applies only to decisions made after `effective_from`; earlier
        decisions keep their version.
      operationId: update_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
        '403':
          description: Authenticated but not allowed (e.g. staff changing policy).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                code: forbidden
                detail: Only the shop owner can change the policy.
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
      security:
      - bearerAuth: []
  /api/v1/shop/policy/versions:
    get:
      tags:
      - shop
      summary: All policy versions, newest first (audit)
      operationId: list_policy_versions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Policy'
                type: array
                title: Response List Policy Versions
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
      security:
      - bearerAuth: []
  /api/v1/orders:
    get:
      tags:
      - orders
      summary: Order inbox
      description: Filter by status and tier. The manual review queue is `status=pending_review`.
      operationId: list_orders
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatus'
          title: Status
      - name: tier
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RiskTier'
          title: Tier
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Search buyer name, phone or external_id.
          title: Q
        description: Search buyer name, phone or external_id.
      - name: placed_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Placed From
      - name: placed_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Placed To
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - -placed_at
          - placed_at
          - -risk_score
          - -cod_amount_vnd
          - -updated_at
          type: string
          default: -placed_at
          title: Sort
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags:
      - orders
      summary: Create one order
      description: Scoring runs asynchronously; poll the order to see the score.
      operationId: create_order
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummary'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Request conflicts with the current state. See `code`.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: conflict
                detail: An order with external_id FB-20261009-0042 already exists.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/orders/import:
    post:
      tags:
      - orders
      summary: Import orders from a CSV file
      description: One row per order, columns as in OrderCreate (items as JSON). Up to 1,000 rows per
        file.
      operationId: import_orders
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_orders'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: Malformed request or file.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad request
                status: 400
                code: validation_error
                detail: CSV header is missing the buyer_phone column.
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
      security:
      - bearerAuth: []
  /api/v1/orders/{order_id}:
    get:
      tags:
      - orders
      summary: 'Order page: score, reasons, decision, contacts, calls, timeline'
      operationId: get_order
      security:
      - bearerAuth: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          description: Order ID.
          examples:
          - ord_01
          title: Order Id
        description: Order ID.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not found
                status: 404
                code: not_found
                detail: Order ord_99 not found.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example: &id001
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
    patch:
      tags:
      - orders
      summary: Edit an order before it ships
      description: Triggers a new scoring run. 409 `order_not_editable` once shipped.
      operationId: update_order
      security:
      - bearerAuth: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          description: Order ID.
          examples:
          - ord_01
          title: Order Id
        description: Order ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not found
                status: 404
                code: not_found
                detail: Order ord_99 not found.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Request conflicts with the current state. See `code`.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: order_not_editable
                detail: Order ord_01 has already shipped.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/orders/{order_id}/override:
    post:
      tags:
      - orders
      summary: Apply a staff decision with a reason
      description: Recorded in the audit log. The action must be in `allowed_overrides` of the order.
      operationId: override_order
      security:
      - bearerAuth: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          description: Order ID.
          examples:
          - ord_01
          title: Order Id
        description: Order ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not found
                status: 404
                code: not_found
                detail: Order ord_99 not found.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Request conflicts with the current state. See `code`.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: order_not_editable
                detail: Order ord_01 has already shipped.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Validation error
                status: 422
                code: validation_error
                errors:
                - loc:
                  - body
                  - buyer_phone
                  msg: String should match pattern '^\+?[0-9]{9,15}$'
                  type: string_pattern_mismatch
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/orders/{order_id}/calls:
    post:
      tags:
      - orders
      summary: Start an AI confirmation call now
      description: 'Contact protection still applies: 409 `contact_blocked` with `block_reasons` when
        the call is not allowed.'
      operationId: start_call
      security:
      - bearerAuth: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          description: Order ID.
          examples:
          - ord_01
          title: Order Id
        description: Order ID.
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Missing or expired access token.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not found
                status: 404
                code: not_found
                detail: Order ord_99 not found.
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Request conflicts with the current state. See `code`.
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Contact blocked
                status: 409
                code: contact_blocked
                detail: This phone already had an AI call in the last 24 hours.
                block_reasons:
                - daily_call_limit
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Request body or parameters failed validation. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example: *id001
  /api/v1/calls/{call_id}:
    get:
      tags:
      - calls
      summary: Call status and result (poll during a live call)
      operationId: get_call
      security:
      - bearerAuth: []
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - call_01
