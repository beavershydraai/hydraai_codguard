        link_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Link Expires At
          description: Set when channel is confirmation_link (48 hours).
        responded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Responded At
        result:
          anyOf:
          - type: string
          - type: 'null'
