        recipient_name_masked:
          type: string
          title: Recipient Name Masked
        phone_masked:
          type: string
          title: Phone Masked
          description: Partially masked phone.
          examples:
          - +84******001
        address_masked:
          type: string
          title: Address Masked
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: 48 hours after the link was sent.
        allowed_actions:
          items:
            $ref: '#/components/schemas/BuyerAction'
          type: array
          title: Allowed Actions
        responded_action:
          anyOf:
          - $ref: '#/components/schemas/BuyerAction'
          - type: 'null'
          description: Set if the buyer already answered.
      additionalProperties: false
      type: object
      required:
      - shop_name
      - order_ref
      - items
      - cod_amount_vnd
      - recipient_name_masked
      - phone_masked
      - address_masked
      - expires_at
      - allowed_actions
      title: BuyerOrderView
      description: What the buyer sees. Personal data is partially masked.
      examples:
      - address_masked: Số 1* ngõ 3*, phường Láng, Hà Nội
        allowed_actions:
        - confirm
        - edit_address
        - cancel
        - not_ordered
        cod_amount_vnd: 330000
        expires_at: '2026-10-11T10:15:06+07:00'
        items:
        - name: Áo thun basic
          quantity: 2
          variant: Size M, màu đen
        order_ref: A7K2
        phone_masked: +84******001
        recipient_name_masked: Nguyễn V** A
        shop_name: Shop Thời Trang Mẫu
    BuyerResponse:
      properties:
        action:
          $ref: '#/components/schemas/BuyerAction'
        new_address:
          anyOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
          description: Required for edit_address.
      additionalProperties: false
      type: object
      required:
      - action
      title: BuyerResponse
      examples:
      - action: confirm
      - action: edit_address
        new_address:
          raw: Số 15 ngõ 34, phường Láng, Hà Nội
    BuyerResponseResult:
      properties:
        action:
          $ref: '#/components/schemas/BuyerAction'
        message_vi:
          type: string
          title: Message Vi
      additionalProperties: false
      type: object
      required:
      - action
      - message_vi
      title: BuyerResponseResult
      examples:
      - action: confirm
        message_vi: Cảm ơn bạn. Đơn hàng đã được xác nhận.
    Call:
      properties:
        id:
          type: string
          title: Id
        order_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Order Ids
        phone_masked:
          type: string
          title: Phone Masked
          description: Partially masked phone.
          examples:
          - +84******001
        status:
          $ref: '#/components/schemas/CallStatus'
        attempt:
          type: integer
          maximum: 2.0
          minimum: 1.0
          title: Attempt
        queued_at:
          type: string
          format: date-time
          title: Queued At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
        duration_seconds:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Duration Seconds
        outcome:
          anyOf:
          - $ref: '#/components/schemas/CallOutcome'
          - type: 'null'
          description: Set when status is completed.
        changes:
          items:
            $ref: '#/components/schemas/CallChange'
          type: array
          title: Changes
        cancel_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancel Reason
        human_callback_requested:
          type: boolean
          title: Human Callback Requested
          default: false
        buyer_requests:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer Requests
