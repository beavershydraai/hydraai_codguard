  /api/v1/internal/calls/{call_id}/status:
    post:
      tags:
      - internal
      summary: Report call progress; `dialing` claims the call
      description: '`dialing` is accepted only for a `queued` call, or again from the controller that
        already claimed it. `in_progress` is accepted only from that controller. Otherwise 409 `call_not_active`:
        the call was cancelled, finished or claimed elsewhere, so the controller acks the job and does
        not dial.'
      operationId: report_call_status
      security:
      - googleIdToken: []
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          description: Call ID from the CallJob.
          examples:
          - call_01
          title: Call Id
        description: Call ID from the CallJob.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
