    currency: INR
    timezone_default: Asia/Kolkata
    timezone_by_region: {}
    phone: {e164_prefix: "+91", mobile_regex: '^\+91[6-9]\d{9}$'}
    languages: [en, hi]
    holiday_calendar: IN_NATIONAL_PLUS_STATE
    channels:
      enabled: [WHATSAPP, SMS, AI_CALL]
