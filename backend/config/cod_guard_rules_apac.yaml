# ---------------------------------------------------------------------------
# Test cases. Mặc định: country VN, phase 1, kênh độc lập, đủ điều kiện go-live, đủ đăng ký sender,
# demo tắt, agent chưa qua cổng chất lượng, giờ người mua thứ Tư 2026-10-14 10:00.
# VN: FAIL = 30000 + 15000 + 5000 + 5000 = 55000
# ---------------------------------------------------------------------------
test_defaults: {country: VN, phase: 1, sales_channel: INDEPENDENT, compliance: ALL_TRUE, demo_enabled: false, agent_quality_gate_passed: false, buyer_local_time: "2026-10-14T10:00"}

test_cases:
  # --- L2 ---
  - {id: T01_prepaid, input: {cod_amount: 0}, expect: {rule: D01, action: ALLOW, state: CLEARED_TO_SHIP, scored: false}}
  - {id: T02_dup_external_id, input: {external_id_seen_in_tenant: true}, expect: {rule: D00, result: IGNORE}}
  - {id: T03_invalid_phone, input: {phone_e164: "+8412345"}, expect: {rule: D03, state: PENDING_REVIEW}}
  - {id: T04_address_incomplete, input: {address_quality: 0.3}, expect: {rule: D05, state: AWAIT_CONFIRM, variant: ADDRESS_FIX}}
  - {id: T09_cross_shop_ignored, input: {tenant_orders_n: 0, other_tenants_fail_rate: 0.9}, expect: {D08_fired: false}}
  - {id: T10_tenant_history_risk, input: {tenant_orders_n: 4, buyer_fail_rate: 0.75}, expect: {rule: D08, then_rule: A01, action: CONFIRM, explore: false}}
  # --- L3 ---
