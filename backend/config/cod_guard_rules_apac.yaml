    expect: {dominant_cause: RTO_REFUSAL, rule: A05, loss_gate: 20350, cost_CONFIRM: 900, action: CONFIRM, confirm_channel: ZNS}
  - id: T36_logistics_no_contact
    input: {probs: {DELIVERED: 0.7, RTO_REFUSAL: 0.03, RTO_UNREACHABLE: 0.02, RTO_BAD_ADDRESS: 0.02, CANCELLED_BEFORE_SHIP: 0.01, MISSED_CUTOFF: 0.02, LOGISTICS_FAILURE: 0.2}, total: 400000}
