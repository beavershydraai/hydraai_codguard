      SMS: {registration_required: true, registration: "DLT: đăng ký doanh nghiệp, header theo loại tin và mẫu nội dung", links: ALLOWED}
      AI_CALL: {registration_required: true, registration: "gọi dịch vụ và giao dịch qua dải số 1600; không dùng số 10 chữ số cho liên lạc thương mại; báo trước nhà mạng khi dùng auto-dialer hoặc robocall"}   # VERIFY dải 1600 có bắt buộc cho thương mại điện tử
    verified_channels: [WHATSAPP_BUTTON, SIGNED_WEB_LINK]
    contact:
      message_window: {slots: [{days: ALL, start: "09:00", end: "21:00"}], basis_type: LAW_DERIVED, basis: "TCCCPR 2018: liên lạc thương mại không mời chỉ 09:00-21:00; tin giao dịch và dịch vụ không giới hạn giờ nhưng COD Guard áp khung này cho thận trọng"}
      call_window: {slots: [{days: [MON, TUE, WED, THU, FRI, SAT], start: "09:00", end: "19:00"}], basis_type: LAW_DERIVED}   # ASSUMPTION thu hẹp
      max_messages_per_phone_24h: 3    # ASSUMPTION
      max_calls_per_phone_24h: 1       # ASSUMPTION
      inferred_consent_days: 7         # TCCCPR sửa đổi 12/02/2025: đồng ý để hoàn tất giao dịch đang diễn ra có hiệu lực 7 ngày
      message_must_include: [shop_name]
      dnc: {registry: "NCPR (DND)", applies_to: PROMOTIONAL, check_for_transactional: false}
    call_recording: {consent: NOTICE}   # VERIFY
    ai_disclosure:
