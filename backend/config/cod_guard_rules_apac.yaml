      order_confirmation_basis: "s.7(a): mục đích cụ thể mà khách tự nguyện cung cấp dữ liệu, ví dụ SĐT để nhận thông tin đơn"
      penalties_note: "tới 250 crore rupee nếu không có biện pháp bảo mật hợp lý"
      cross_border_to_hosting: "DPDP cho chuyển ra nước ngoài trừ nơi bị chính phủ hạn chế"   # VERIFY
    go_live:
      for_live: [dlt_entity_registered, privacy_notice_published]
      for_call: [robocall_intimation_to_operator, recording_notice_script_approved]
    payments: {deposit_rail: UPI}
    logistics: {ship_cutoff_local: "15:00", max_delivery_attempts_default: 3, carriers_examples: [Delhivery, Xpressbees, Shadowfax, "Blue Dart", "India Post"], ndr_reason_map_ref: "ndr_maps/IN_{carrier}.yaml"}   # ASSUMPTION
    marketplaces_examples: [Amazon, Flipkart, Meesho]
    costs:   # ASSUMPTION, INR
      shipping_out: 60
      return_fee: 60
      packaging: 10
      handling_per_return: 10
      contact: {WHATSAPP: 0.15, SMS: 0.2, AI_CALL: 1.5, SELLER_REVIEW: 5}
      friction_good_customer: {CONFIRM: 0.5, CALL: 2, DEPOSIT: 10}
      gross_margin_rate: 0.3
      logistics_failure_recovery_rate: 0.5
      high_value_order: 3000
      deposit_min: 49
      max_contact_cost_per_order: 4
    sources:
      - {t: "TRAI PR 11/2025 về sửa TCCCPR", url: "https://cms.trai.gov.in/sites/default/files/2025-02/PR_No.11of2025.pdf"}
      - {t: "TCCCPR amendments (JSA)", url: "https://www.jsalaw.com/wp-content/uploads/2025/02/JSA-Prism-Telecommunications_February-2025_TCCCPR-amendments.Final_.pdf"}
      - {t: "Khung giờ TRAI (Exotel, nguồn nhà cung cấp)", url: "https://developer.exotel.com/docs/faqs/calling-hours"}
      - {t: "DPDP Rules 2025 (PIB)", url: "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/nov/doc20251117695301.pdf"}
      - {t: "DPDP Act s.7", url: "https://www.dpdpa.com/dpdpa2023/chapter-2/section7.html"}

