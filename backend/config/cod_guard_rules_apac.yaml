# cod_guard_rules_apac.yaml — Policy Engine COD Guard cho các nước APAC
# Chuẩn nghiệp vụ: Baseline A v1 (Business Decision Baseline) và trang tổng v1, ngày 13/10/2026.
# File này THAY THẾ cod_guard_rules.yaml bản cand.2 và chạy độc lập, không cần gộp với cand.2.
#
# QUY ƯỚC THỰC THI
# - Khóa `when`, `guard`, `expr`, `to_expr` và mọi khóa có hậu tố `_expr`: biểu thức Python-subset,
#   chạy bằng simpleeval.EvalWithCompoundTypes (KHÔNG dùng eval). Khóa `doc`, `basis`, `note`: chỉ để đọc.
# - Thứ tự gộp tham số: core_parameters ← country_packs[country] ← cấu hình của shop (tenant_overrides).
# - Khung giờ luôn tính theo giờ địa phương của NGƯỜI MUA (múi giờ theo địa chỉ giao), không theo giờ máy chủ.
# - "# ASSUMPTION": giá trị giả định, business cần chốt. "# VERIFY": khẳng định pháp lý, pháp chế nước đó cần xác nhận.
# - basis_type của khung giờ:
#     LAW          luật quy định trực tiếp cho loại liên hệ này
#     LAW_DERIVED  luật quy định cho quảng cáo/tiếp thị; COD Guard áp bảo thủ cho tin giao dịch
#     ANALOG       mượn quy định của ngành khác (ví dụ đòi nợ); không ràng buộc trực tiếp
#     DEFAULT      không tìm thấy quy định; dùng mặc định thận trọng của COD Guard
# - Ngày trong slot: MON..SUN và HOLIDAY. "ALL" = cả 7 ngày và ngày lễ.
#   Hôm nay là ngày lễ thì chỉ xét các slot có HOLIDAY; không slot nào có HOLIDAY nghĩa là ngày lễ đóng.

metadata:
  schema_version: "2.0"
  rule_set_version: "2026.10.13-apac.1"
  supersedes: "2026.10.13-cand.2"
  status: candidate                          # candidate | approved | deprecated
  date: "2026-10-13"
  owner: "COD Guard Policy Engine – người duyệt: TBD"   # ASSUMPTION
  phase: 1                                   # 0..3 theo Baseline A mục 7; pha 0 = chế độ bóng
  default_country: VN
  hosting_region: "asia-southeast1 (Singapore)"   # theo task E1.1; dữ liệu người mua ngoài SG là chuyển ra nước ngoài
  demo:
    enabled: true
    countries: [VN]
    demo_enable_call: true                   # NGOẠI LỆ so với pha 1: bật CALL để trình diễn
    demo_enable_deposit: true                # NGOẠI LỆ: DEPOSIT (mock); production chỉ pha 3
    demo_phone_allowlist_only: true          # demo chỉ gọi/nhắn số nội bộ team
    demo_bypass_go_live_prerequisites: true  # chỉ áp cho số trong allowlist
    demo_call_retry_gap_minutes: 30
    log_flag: DEMO_EXCEPTION
  changelog:
    apac.1:
      - "Đổi tên theo Baseline A: SHIP_NOW→ALLOW, REFUSED→RTO_REFUSAL, UNREACHABLE→RTO_UNREACHABLE, WRONG_ADDRESS→RTO_BAD_ADDRESS, PARTIAL_COD→NUDGE_PREPAID, PREPAID_ONLY→REQUIRE_PREPAID"
      - "Pha 0..3 theo Baseline A; pha 0 thay cho mode: shadow"
      - "L3 theo bảng 7.1 Baseline A: LOGISTICS_FAILURE không liên hệ khách; RTO_UNREACHABLE pha 2 CALL, không nghe máy thì CONFIRM; RTO_REFUSAL CONFIRM"
      - "Cổng kênh bán: DEPOSIT và Checkout Admission chỉ cho kênh độc lập; đơn từ sàn chỉ ALLOW hoặc REVIEW"
      - "CALL chỉ bật khi Agent Hội thoại qua cổng chất lượng (Baseline A 7.1)"
      - "Thăm dò loại trừ khách được người bán đánh dấu ưu tiên; người bán quyết định tỷ lệ và phân khúc (Baseline A 7.2)"
      - "Agent không được thu cọc, cam kết khuyến mãi, giới thiệu sản phẩm khác (ma trận quyền Baseline A)"
      - "Trần chi phí liên hệ mỗi đơn (chính sách không được vượt trần chi phí)"
      - "L1 tham số hóa theo country pack: khung giờ theo giờ người mua, ngày lễ, số lần, đăng ký sender, ghi âm, link trong SMS, công bố AI, hạn đồng ý ngầm"
      - "Country packs: VN, ID, PH, TH, MY, SG, IN; nước khác chỉ chạy pha 0"
      - "Điều kiện go-live theo nước; thiếu thì ép pha 0"
      - "SĐT một nước, giao hàng nước khác: áp ràng buộc liên hệ của cả hai nước"
      - "Đo lường theo Baseline A mục 9: đơn chưa có kết quả là dữ liệu bị cắt; chỉ số công bằng theo địa bàn"

baseline_alignment:   # tên cũ (cand.2) → tên Baseline A; dùng để migrate log và code đã viết theo cand.2
  outcomes: {REFUSED: RTO_REFUSAL, UNREACHABLE: RTO_UNREACHABLE, WRONG_ADDRESS: RTO_BAD_ADDRESS}
  actions: {SHIP_NOW: ALLOW, PARTIAL_COD: NUDGE_PREPAID, PREPAID_ONLY: REQUIRE_PREPAID}
  causes: {INTENT: RTO_REFUSAL, REACHABILITY: RTO_UNREACHABLE, ADDRESS: RTO_BAD_ADDRESS, LOGISTICS: LOGISTICS_FAILURE}
  events: {DECIDED_SHIP: DECIDED_ALLOW}
  phases: {"mode: shadow": "phase: 0"}

# ---------------------------------------------------------------------------
# Context evaluator phải dựng trước khi chạy biểu thức
# ---------------------------------------------------------------------------
expression_context:
  names:
    order: "total, cod_amount, is_gift, packed, sales_channel (INDEPENDENT|MARKETPLACE), marketplace, ship_country, ship_region, external_id_seen_in_tenant, seller_hold_flag, seller_priority_customer, buyer_phone_hash, recipient_phone_hash, created_at"
    phone: "e164, country (suy từ mã nước), valid (khớp country.phone.mobile_regex), in_demo_allowlist"
    address: "quality_score, missing_fields, changed_since_trust, fix_attempts, raw"
    tenant_history: "CHỈ trong tenant: orders_n, buyer_fail_rate, trusted_until, not_ordered_block_active, same_phone_same_sku_24h"
    country: "country pack đã chọn ở country_resolution, truy cập bằng dấu chấm"
    contact_packs: "các pack áp cho việc LIÊN HỆ: nước giao hàng, cộng nước của SĐT nếu khác và được hỗ trợ"
    tenant: "core_parameters ← country pack ← cấu hình shop"
    c: "alias của tenant.costs, đơn vị tiền theo country.currency"
    features: "alias của data_isolation.features"
    phase: "pha hiệu lực sau phase_resolution"
    effective_actions: "xem derived.effective_actions_expr"
    probs: "7 kết quả → xác suất đã hiệu chỉnh, tổng = 1"
    l1: "kết quả gộp tầng L1: removed_channels, deferred_channels, defer_until, confirm_variant, flags"
    l2: "kết quả tầng L2: rule_id, action, cause, floor_action_by_phase, dominant_cause_override, exploration_allowed"
    event: "type, source, verified (đến từ kênh trong country.verified_channels), amount, event_time"
    out: "đầu ra Agent Hội thoại đã validate theo agent_output_contract"
    state: "trạng thái hiện tại của đơn"
    buyer_local_hm: "'HH:MM' theo múi giờ người mua"
    buyer_local_dow: "MON..SUN theo múi giờ người mua"
    is_public_holiday: "theo lịch ngày lễ của country.holiday_calendar (và vùng nếu có)"
    days_since_order: "số ngày từ order.created_at tới bây giờ"
  derived:   # tính theo đúng thứ tự
    demo_active_expr: "metadata.demo.enabled and country.code in metadata.demo.countries and phone.in_demo_allowlist"
    demo_call_expr: "demo_active and metadata.demo.demo_enable_call"
    demo_deposit_expr: "demo_active and metadata.demo.demo_enable_deposit"
    demo_added_actions_expr: "(['CALL'] if demo_call else []) + (['DEPOSIT'] if demo_deposit else [])"
    effective_actions_expr: "sorted(set([a for a in (phase_capabilities[phase]['actions'] + demo_added_actions) if a in sales_gate.allowed_actions and (a != 'CALL' or tenant.agent_quality_gate_passed or demo_call) and (a != 'DEPOSIT' or order.sales_channel == 'INDEPENDENT')]))"
    FAIL_expr: "c.shipping_out + c.return_fee + c.packaging + c.handling_per_return"
    loss_outcomes_expr: "[o for o in OUTCOMES if OUTCOME_META[o]['in_loss_gate']]"
  helpers:   # cài trong evaluator Python, đăng ký vào simpleeval.functions
    in_window: "in_window(kind) → True nếu giờ người mua nằm trong slot của khung `kind` (message|call|call_extension) ở MỌI pack trong contact_packs; pack không có khung `kind` → False"
    next_window_start: "next_window_start(kind) → thời điểm sớm nhất (giờ người mua) mà in_window(kind) đúng"
    sender_registered: "sender_registered(ch) → True nếu country.channels[ch].registration_required là false, hoặc tenant.compliance[country.code][ch + '_registered'] là true"
    prerequisites_met: "prerequisites_met(group) → all(tenant.compliance[country.code][k] for k in country.go_live[group])"
    pick_confirm_channel: "kênh đầu tiên trong country.channels.confirm_priority không nằm trong l1.removed_channels; None nếu không còn"
    contact_cost: "contact_cost(ch) → c.contact[ch] (chi phí một lần liên hệ, đơn vị tiền của nước)"
    dnc_listed: "dnc_listed(ch) → kết quả tra registry của country.dnc; chỉ gọi khi country.dnc.check_for_transactional"
    harm: "harm(a) → enums.actions[a].harm"
    argmax: "argmax(d) → khóa có giá trị lớn nhất"
    pick_floor_action: "pick_floor_action(floor, actions) → floor nếu có trong actions; nếu không, hành động có harm ≥ harm(floor) và harm nhỏ nhất (hòa thì REVIEW đứng sau); không có thì 'REVIEW'"
    ev_argmax: "ev_argmax(A) → argmax EV theo hiệu ứng can thiệp đã ước lượng (chỉ pha 3; chưa cài cho hackathon)"
    hours_until: "hours_until(dt)"
    minutes_since: "minutes_since(dt); None → 10**9"
    open_orders_same_phone_tenant_within: "open_orders_same_phone_tenant_within(minutes)"
    unit_uniform: "unit_uniform(stream) → int(sha256(salt+phone_hash+experiment_id+':'+stream).hexdigest()[:8],16)/2**32"
    seller_segment_allowed: "seller_segment_allowed() → đơn thuộc phân khúc người bán cho phép thăm dò"
    builtins: [len, min, max, sum, abs, sorted, set, int]

# ---------------------------------------------------------------------------
# Chọn nước, pha hiệu lực, cổng kênh bán
# ---------------------------------------------------------------------------
country_resolution:
  supported: [VN, ID, PH, TH, MY, SG, IN]
  hit_policy: FIRST
  rules:
    - {id: R01_ship_country, when: "order.ship_country in SUPPORTED_COUNTRIES", then: {country_expr: "order.ship_country"}}
    - {id: R02_phone_country, when: "order.ship_country is None and phone.country in SUPPORTED_COUNTRIES", then: {country_expr: "phone.country"}}
    - {id: R03_unsupported, when: "True", then: {country: UNSUPPORTED}}
  contact_packs_expr: "[country.code] + ([phone.country] if (phone.country in SUPPORTED_COUNTRIES and phone.country != country.code) else [])"
  buyer_timezone_expr: "country.timezone_by_region.get(order.ship_region, country.timezone_default)"
  cross_border_note: "SĐT nước A, giao ở nước B: khung giờ, số lần, ghi âm và đăng ký sender lấy mức chặt nhất của cả hai; dữ liệu chịu luật của cả hai nước nên gắn cờ cho pháp chế"

phase_resolution:
  doc: "Baseline A mục 7: pha sau chỉ mở khi pha trước đã tạo đủ bằng chứng"
  effective_phase_expr: "0 if (country.status == 'UNSUPPORTED' or not (prerequisites_met('for_live') or (demo_active and metadata.demo.demo_bypass_go_live_prerequisites))) else min(metadata.phase, country.max_phase)"
  phase_0_behavior: {contact_buyer: false, change_order_state: false, show_recommendation_to_seller: true, decision_log_executed: false}

phase_capabilities:
  0: {actions: [], recommend_only: true}
  1: {actions: [ALLOW, CONFIRM, REVIEW], exploration: false, ev_mode: rank_and_gate}
  2: {actions: [ALLOW, CONFIRM, CALL, REVIEW], exploration: true, exploration_pairs: [[ALLOW, CONFIRM], [CONFIRM, CALL]], ev_mode: rank_and_gate}
  3: {actions: [ALLOW, CONFIRM, CALL, DEPOSIT, REVIEW], exploration: true, exploration_pairs: [[ALLOW, CONFIRM], [CONFIRM, CALL]], ev_mode: uplift_ev}   # không bao giờ thăm dò DEPOSIT

sales_channel_gate:   # Baseline A: DEPOSIT và Checkout Admission chỉ cho kênh độc lập
  hit_policy: FIRST
  rules:
    - id: G01_marketplace
      when: "order.sales_channel == 'MARKETPLACE'"
      then: {allowed_actions: [ALLOW, REVIEW], contact_buyer: false, checkout_admission: false}
      basis: "Sàn kiểm soát liên lạc và thanh toán. Ví dụ Shopee: người bán không được chủ động xin thông tin liên hệ của người mua, trừ khi người mua tự đưa qua Shopee Chat (quy định chat áp từ 16/09/2024)"   # VERIFY chính sách từng sàn, từng nước
    - {id: G02_independent, when: "True", then: {allowed_actions: [ALLOW, CONFIRM, CALL, DEPOSIT, REVIEW], contact_buyer: true, checkout_admission: true}}

# ---------------------------------------------------------------------------
# Danh mục
# ---------------------------------------------------------------------------
enums:
  outcomes:   # Baseline A mục 2
    DELIVERED:             {vi: "Giao thành công, thu được tiền", known_at: AFTER_DELIVERY, buyer_caused: false, is_failure: false, in_loss_gate: false}
    CANCELLED_BEFORE_SHIP: {vi: "Hủy trước khi xuất kho; ghi ai hủy (khách, người bán, hệ thống)", known_at: BEFORE_SHIP, buyer_caused: BY_CANCELLER, is_failure: false, in_loss_gate: false}   # ASSUMPTION: business chốt có tính vào tổn thất không
    RTO_REFUSAL:           {vi: "Khách từ chối nhận", known_at: AFTER_ATTEMPT, buyer_caused: true, is_failure: true, in_loss_gate: true}
    RTO_UNREACHABLE:       {vi: "Không liên lạc được, không có mặt", known_at: AFTER_ATTEMPT, buyer_caused: true, is_failure: true, in_loss_gate: true}
    RTO_BAD_ADDRESS:       {vi: "Địa chỉ sai hoặc không tìm được", known_at: AFTER_ATTEMPT, buyer_caused: true, is_failure: true, in_loss_gate: true}
    LOGISTICS_FAILURE:     {vi: "Lỗi phía hãng: thất lạc, hư hỏng, không phục vụ được khu vực", known_at: AFTER_ATTEMPT, buyer_caused: false, is_failure: true, in_loss_gate: false}
    MISSED_CUTOFF:         {vi: "Trễ chuyến, xử lý lại", known_at: BEFORE_SHIP, buyer_caused: false, is_failure: true, in_loss_gate: false}
  non_label_sources: [HUMAN_OVERRIDE, AGENT_INTERPRETATION, DEFAULT_APPLIED_DECISION, OUTCOME_UNKNOWN]
  causes: [RTO_REFUSAL, RTO_UNREACHABLE, RTO_BAD_ADDRESS, LOGISTICS_FAILURE, DUPLICATE, NONE]
  actions:   # Pre-Shipment Guard, Baseline A
    ALLOW:   {vi: "Giao ngay", harm: 0, explorable: true, channel_kind: none}
    CONFIRM: {vi: "Tin nhắn kèm nút xác nhận", harm: 1, explorable: true, uses_agent: false, channel_kind: message, variants: [ORDER_CONFIRM, ADDRESS_FIX, DUPLICATE_CHECK, REPLY_KEYWORD], requires: "SĐT thật, trong khung giờ cho phép"}
    CALL:    {vi: "Agent giọng nói gọi xác nhận", harm: 2, explorable: true, uses_agent: true, channel_kind: voice, min_phase: 2, requires: "SĐT thật, chưa vượt trần liên hệ, số gọi ra đã đăng ký định danh, agent qua cổng chất lượng"}
    DEPOSIT: {vi: "Đặt cọc qua QR nội địa của nước (mock khi demo)", harm: 3, explorable: false, channel_kind: message, min_phase: 3, requires: "chỉ kênh độc lập; pha 3 khi có bằng chứng hiệu quả"}
    REVIEW:  {vi: "Chuyển người bán duyệt", harm: 1, explorable: false, channel_kind: none}
  checkout_admission_actions:   # Baseline A: chỉ kênh độc lập có tích hợp bước thanh toán
    ALLOW_COD: {vi: "Cho chọn COD"}
    NUDGE_PREPAID: {vi: "Khuyến khích trả trước"}
    REQUIRE_PREPAID: {vi: "Bắt buộc trả trước", requires: "người bán bật rõ ràng"}
  ndr_actions: [NDR_CONFIRM, NDR_CALL, REATTEMPT, REQUEST_RTO, RECOMMEND_RTO, REVIEW, WAIT]
  removed_actions: {INVESTIGATE: "là workflow, không phải hành động", CHECKOUT_GATE: "thuộc CHECKOUT_ADMISSION"}   # chỉ để đọc
  order_states:
    non_terminal: [NEW, SCORING, AWAIT_CONFIRM, AWAIT_CALL, AWAIT_DEPOSIT, AWAIT_CANCEL_CONFIRM, DEFERRED, DEFAULT_APPLIED, PENDING_REVIEW, CLEARED_TO_SHIP, SHIPPED, NDR]
    terminal: [CANCELLED, DELIVERED, RTO]
    pre_pickup: [NEW, SCORING, AWAIT_CONFIRM, AWAIT_CALL, AWAIT_DEPOSIT, AWAIT_CANCEL_CONFIRM, DEFERRED, DEFAULT_APPLIED, PENDING_REVIEW, CLEARED_TO_SHIP]
  workflows:
    CHECKOUT_ADMISSION: {enabled_from_phase: 3}   # ASSUMPTION
    PRE_SHIPMENT_GUARD: {enabled_from_phase: 1}
    NDR_RECOVERY: {enabled_from_phase: 1}
  channels:
    message: [ZNS, WHATSAPP, LINE, VIBER, MESSENGER, SMS]
    voice: [AI_CALL]
  days: [MON, TUE, WED, THU, FRI, SAT, SUN, HOLIDAY]

# ---------------------------------------------------------------------------
# Tham số chung (không phụ thuộc nước); tiền và khung giờ nằm trong country_packs
# ---------------------------------------------------------------------------
core_parameters:
  thresholds:
    address_quality_min: 0.6          # ASSUMPTION
    address_fix_max_attempts: 1
    history_min_orders: 3
    history_fail_rate: 0.75
    dominant_cause_min: 0.10          # ASSUMPTION
    agent_confidence_min: 0.8         # ASSUMPTION
    deposit_rate: 0.2                 # ASSUMPTION
  timeouts:
    confirm_link_ttl_hours: 48
    confirm_reminder_after_minutes: 120
    confirm_decision_deadline_hours: 6     # ASSUMPTION
    cancel_confirm_ttl_hours: 12           # ASSUMPTION
    call_retry_gap_minutes: 120
    call_max_attempts_per_order: 2
    deposit_deadline_hours: 24             # ASSUMPTION
    review_sla_hours: 12                   # ASSUMPTION; quá SLA nhắc lại, không tự hủy
    defer_max_hours: 72
    trust_after_confirm_days: 7            # trong tenant
    not_ordered_block_days: 30             # trong tenant
    order_merge_window_minutes: 15
    model_timeout_ms: 500
    outcome_wait_days: 30
    ndr_first_contact_minutes: 60
    ndr_call_after_minutes: 90
  default_on_no_response_state:   # người bán cấu hình được (Baseline A: cấu hình hành động mặc định khi hết hạn)
    RTO_BAD_ADDRESS: PENDING_REVIEW
    RTO_UNREACHABLE: CLEARED_TO_SHIP       # ASSUMPTION
    RTO_REFUSAL: PENDING_REVIEW
    DUPLICATE: PENDING_REVIEW
    LOGISTICS_FAILURE: CLEARED_TO_SHIP
    NONE: CLEARED_TO_SHIP
  agent_quality_gate_passed: false         # bật khi Agent Hội thoại qua cổng chất lượng (Baseline A 7.1)
  exploration: {epsilon: 0.05, segments: ALL}   # ASSUMPTION; người bán quyết định tỷ lệ và phân khúc (Baseline A 7.2)
  checkout: {payment_step_integrated: false, require_prepaid_enabled: false, require_prepaid_min_loss: null}

# ---------------------------------------------------------------------------
# Policy mặc định theo tier (E4.2). Đây là mục backend ĐANG CHẠY: app/decision/policy.py đọc mục này,
# validate bằng schema Policy của API (app/schemas/shops.py). Các tầng L1-L4 ở dưới chưa được cài.
# - Chỉ liên hệ khi expected_loss > chi phí của hành động (ShopSettings); không thì gửi ngay.
# - AI gọi tối đa 2 lần mỗi đơn, cách nhau ít nhất 30 phút; hết lượt mà không nghe máy thì chờ duyệt.
# - Bước leo thang không có phản hồi (ví dụ Medium: AI gọi sau link) cũng hết thì chờ duyệt.
# Shop đổi policy thì tạo version mới, chỉ áp cho quyết định sau effective_from (E7.6).
# ---------------------------------------------------------------------------
tier_policy:
  version: 1
  effective_from: "2026-10-13T00:00:00+07:00"
  updated_by: system
  tiers:
    - {tier: low, action: ship_now, if_no_response: null, no_response_after_minutes: null}
    - {tier: medium, action: send_confirmation_link, if_no_response: ai_call, no_response_after_minutes: 120}
    - {tier: high, action: ai_call, if_no_response: hold_for_review, no_response_after_minutes: 30}
    - {tier: very_high, action: require_deposit, if_no_response: hold_for_review, no_response_after_minutes: 1440}

permissions:   # Baseline A, ma trận quyền; "deny" luôn thắng
  agent:
    allow: [collect_evidence, converse, propose_change, emit_agent_output]
    deny: [cancel_order, ship_order, collect_deposit, promise_promotion, introduce_other_products, request_money, request_otp, block_phone, mark_label]
  policy_engine:
    allow: [choose_action_from_allowed_list, apply_post_interaction_table, apply_default, log_decision]
    deny: [exceed_contact_cost_cap, exceed_contact_window, exceed_contact_count, use_generative_ai, read_cross_tenant_data_unless_approved]
  workflow:
    allow: [manage_state, deadlines, retries, dedupe_events]
    deny: [change_business_decision]
  seller:
    allow: [override, approve_exception, configure_default_on_timeout, set_exploration_rate_and_segments, mark_priority_customer, set_tenant_parameters]
    scope: "không giới hạn trong phạm vi shop"
    require: [written_reason_for_override]
  buyer:
    allow: [confirm, confirm_cancel, change_address, change_delivery_time, pay_deposit, opt_out_contact]
    via: "kênh có thể kiểm chứng (country.verified_channels)"
  cancel_authority:
    allowed_sources: [BUYER_VERIFIED_CHANNEL, SELLER_DECISION]
    forbidden_sources: [AGENT_INTERPRETATION, MODEL_SCORE, TIMEOUT]

evidence_by_decision_point:   # Baseline A: bằng chứng có sẵn ở từng thời điểm
  CHECKOUT: {evidence: [cart, phone, address_being_typed, phone_history_in_shop], decider: checkout_policy}
  ORDER_CREATED: {evidence: [full_order, address_check, duplicate_check, pickup_cutoff], decider: initial_policy}
  AFTER_INTERACTION: {evidence: [structured_conversation_result, deposit_result], decider: post_interaction_table, model_rerun: false}
  AFTER_FAILED_DELIVERY: {evidence: [carrier_reason_code, attempt_count, prior_interactions], decider: ndr_policy}
  rule: "Đặc trưng của mô hình tại một thời điểm chỉ dùng bằng chứng có ở thời điểm đó hoặc trước đó"

# ---------------------------------------------------------------------------
# Các tầng luật
# ---------------------------------------------------------------------------
layers:

  - id: L1_compliance_contact_protection
    order: 1
    hit_policy: COLLECT
    aggregation: most_restrictive          # giao tập kênh còn được phép, lấy mốc hoãn muộn nhất
    evaluate_per_channel_expr: "country.channels.enabled"
    rules:
      - {id: C01_message_window, when: "channel != 'AI_CALL' and not in_window('message')", then: {defer_channel: true, defer_until_expr: "next_window_start('message')"}}
      - {id: C02_call_window, when: "channel == 'AI_CALL' and not in_window('call') and not (buyer_opted_in_extended_call and in_window('call_extension'))", then: {defer_channel: true, defer_until_expr: "next_window_start('call')"}}
      - {id: C03a_opt_out_calls, when: "channel == 'AI_CALL' and buyer_opted_out_calls_tenant", then: {remove_channel: true}}
      - {id: C03b_opt_out_all, when: "buyer_opted_out_all_tenant", then: {remove_channel: true}}
      - {id: C03c_dnc, when: "country.contact.dnc.check_for_transactional and dnc_listed(channel)", then: {remove_channel: true}}
      - {id: C04_call_frequency, when: "channel == 'AI_CALL' and (calls_to_phone_24h_tenant >= country.contact.max_calls_per_phone_24h or call_attempts_order >= tenant.timeouts.call_max_attempts_per_order)", then: {remove_channel: true}}
      - {id: C05_call_retry_gap, when: "channel == 'AI_CALL' and minutes_since(last_call_at_order) < (metadata.demo.demo_call_retry_gap_minutes if demo_active else tenant.timeouts.call_retry_gap_minutes)", then: {defer_channel: true, defer_until_expr: "last_call_at_order_plus_gap"}}
      - {id: C06_message_frequency, when: "channel != 'AI_CALL' and messages_to_phone_24h_tenant >= country.contact.max_messages_per_phone_24h", then: {remove_channel: true}}
      - {id: C07_merge_same_phone, when: "open_orders_same_phone_tenant_within(tenant.timeouts.order_merge_window_minutes) > 1", then: {merge_contact: true}}
      - {id: C08_gift_order, when: "order.is_gift or order.recipient_phone_hash != order.buyer_phone_hash", then: {contact_target: buyer, never_contact: recipient}}
      - {id: C09_content_guard, when: "True", then: {content: transactional_template_only, forbid: [promotion, upsell, other_products, promise_promotion, request_money_in_call, request_otp], deposit_only_via_expr: "country.payments.deposit_rail", on_promotional_template: REMOVE_CHANNEL}}
      - {id: C10_identity_ai_disclosure, when: "channel == 'AI_CALL'", then: {must_announce: [shop_name, automated_assistant, purpose], script_expr: "country.ai_disclosure.script_draft"}}
      - {id: C11_global_cap, when: "features.global_contact_cap.enabled and channel == 'AI_CALL' and calls_to_phone_24h_all_tenants >= 1", then: {remove_channel: true}}   # mặc định TẮT; short-circuit nên biến xuyên tenant không bị đọc
      - {id: C12_sender_registration, when: "not sender_registered(channel)", then: {remove_channel: true, ops_alert: "kênh chưa đăng ký sender hoặc mẫu tin ở nước này"}}
      - {id: C13_recording_consent, when: "channel == 'AI_CALL' and country.call_recording.consent == 'ALL_PARTIES'", then: {ask_recording_consent_first: true, on_decline: END_CALL_DISCARD_RECORDING}}
      - {id: C14_sms_links, when: "channel == 'SMS' and country.channels.SMS.links == 'AVOID'", then: {confirm_variant: REPLY_KEYWORD, no_links: true}}
      - {id: C15_contact_cost_cap, when: "contact_cost_spent_order + contact_cost(channel) > c.max_contact_cost_per_order", then: {remove_channel: true}}
      - {id: C16_required_message_fields, when: "channel != 'AI_CALL' and len(country.contact.message_must_include) > 0", then: {must_include_expr: "country.contact.message_must_include"}}
      - {id: C17_call_prerequisites, when: "channel == 'AI_CALL' and not (prerequisites_met('for_call') or demo_active)", then: {remove_channel: true}}
      - {id: C18_inferred_consent_window, when: "country.contact.inferred_consent_days is not None and days_since_order > country.contact.inferred_consent_days", then: {remove_channel: true}}
    output_mapping:   # đầu ra L1 tác động lên hành động đã chọn ở L3
      - {when: "chosen_channel is not None and chosen_channel in l1.removed_channels", then: {fallback_action_expr: "'CONFIRM' if (chosen_action == 'CALL' and confirm_channel is not None) else 'REVIEW'"}}
      - {when: "chosen_channel is not None and chosen_channel in l1.deferred_channels", then: {state: DEFERRED, deferred_reason: CONTACT_WINDOW, resume_action_expr: "chosen_action", earliest_contact_at_expr: "l1.defer_until[chosen_channel]"}}

  - id: L2_deterministic_checks
    order: 2
    hit_policy: FIRST
    doc: "terminal=true: quyết định xong ở L2 (hành động đi qua fit_to_effective). terminal=false: chuyển sang L3 kèm thông tin"
    fit_to_effective_expr: "action if action in effective_actions else ('REVIEW' if 'REVIEW' in effective_actions else 'ALLOW')"
    rules:
      - {id: D00_dup_external_id, when: "order.external_id_seen_in_tenant", then: {result: IGNORE}, terminal: true}
      - {id: D01_prepaid, when: "order.cod_amount == 0", then: {action: ALLOW, skip_scoring: true}, terminal: true}
      - {id: D02_seller_flag, when: "order.seller_hold_flag", then: {action: REVIEW}, terminal: true}
      - {id: D03_invalid_phone, when: "not phone.valid", then: {action: REVIEW}, terminal: true}
      - {id: D04_tenant_not_ordered_block, when: "tenant_history.not_ordered_block_active", then: {action: REVIEW}, terminal: true}
      - {id: D05_address, when: "address.quality_score < tenant.thresholds.address_quality_min or len(address.missing_fields) > 0", then: {action: CONFIRM, variant: ADDRESS_FIX, cause: RTO_BAD_ADDRESS}, terminal: true}
      - {id: D06_possible_duplicate, when: "tenant_history.same_phone_same_sku_24h", then: {action: CONFIRM, variant: DUPLICATE_CHECK, cause: DUPLICATE, buttons: [KEEP_BOTH, KEEP_ONE]}, terminal: true}   # Baseline A: luật cứng, gộp hoặc hỏi lại
      - {id: D07_tenant_trusted, when: "tenant_history.trusted_until is not None and now < tenant_history.trusted_until and not address.changed_since_trust", then: {action: ALLOW, skip_scoring: true}, terminal: true}
      - id: D08_tenant_history_high_risk     # chỉ lịch sử trong tenant
        when: "tenant_history.orders_n >= tenant.thresholds.history_min_orders and tenant_history.buyer_fail_rate >= tenant.thresholds.history_fail_rate"
        then: {cause: RTO_REFUSAL, dominant_cause_override: RTO_REFUSAL, floor_action_by_phase: {1: CONFIRM, 2: CALL, 3: DEPOSIT}, exploration_allowed: false}
        terminal: false
      - {id: D09_fallthrough, when: "True", then: {}, terminal: false}

  - id: L3_initial_action
    order: 3
    hit_policy: PRIORITY                     # số nhỏ = ưu tiên cao
    doc: "Baseline A mục 3 và 7.1: ở pha 0-2 mô hình chỉ xếp hạng và xác định nguyên nhân chính; hành động lấy từ bảng nguyên nhân. P(o|x,a) với a khác ALLOW là hiệu ứng can thiệp, chỉ dùng ở pha 3"
    derived:   # tính theo thứ tự
      cause_scores_expr: "{'RTO_REFUSAL': probs['RTO_REFUSAL'] + probs['CANCELLED_BEFORE_SHIP'], 'RTO_UNREACHABLE': probs['RTO_UNREACHABLE'], 'RTO_BAD_ADDRESS': probs['RTO_BAD_ADDRESS'], 'LOGISTICS_FAILURE': probs['LOGISTICS_FAILURE'] + probs['MISSED_CUTOFF']}"
      dominant_cause_expr: "l2.dominant_cause_override if l2.dominant_cause_override else (argmax(cause_scores) if max(cause_scores.values()) >= tenant.thresholds.dominant_cause_min else 'NONE')"
      U_expr: "{'DELIVERED': order.total * c.gross_margin_rate, 'RTO_REFUSAL': -FAIL, 'RTO_UNREACHABLE': -FAIL, 'RTO_BAD_ADDRESS': -FAIL, 'CANCELLED_BEFORE_SHIP': -(c.packaging if order.packed else 0), 'MISSED_CUTOFF': -(c.packaging + c.handling_per_return), 'LOGISTICS_FAILURE': -(c.shipping_out + c.return_fee) * (1 - c.logistics_failure_recovery_rate)}"
      loss_gate_expr: "sum([probs[o] * abs(U[o]) for o in loss_outcomes])"
      confirm_channel_expr: "pick_confirm_channel()"
      cost_CONFIRM_expr: "(contact_cost(confirm_channel) if confirm_channel is not None else 1e12) + c.friction_good_customer.CONFIRM * probs['DELIVERED']"
      cost_CALL_expr: "contact_cost('AI_CALL') + c.friction_good_customer.CALL * probs['DELIVERED']"
      cost_REVIEW_expr: "c.contact.SELLER_REVIEW"
    ev_doc: |
      EV(a|x) = Σ_o P(o|x,a)·U(o,a,x), U đã trừ chi phí của chính hành động (Baseline A mục 3).
      Pha 1-2 (rank_and_gate): lấy hành động từ bảng nguyên nhân; chỉ liên hệ khi loss_gate ≥ cost của hành động.
      loss_gate coi như can thiệp xóa hết tổn thất, nên là cận trên: nếu cận trên còn không bù được chi phí thì không liên hệ.
      Pha 3 (uplift_ev): ev_argmax dùng hiệu ứng can thiệp ước lượng doubly robust từ log thăm dò.
    uncertainty:
      entropy_norm_doc: "-Σ p·ln p / ln 7"
      margin_top2_doc: "p_(1) - p_(2)"
      epistemic_std_doc: "độ lệch chuẩn giữa các mô hình ensemble của tổng xác suất trong loss_outcomes"
      decision_uncertain_expr: "margin_top2 < 0.15 or epistemic_std > 0.08 or tenant_labeled_orders < 200"   # ASSUMPTION
      note: "Khoảng cách tới 0,5 KHÔNG phải độ bất định"
    rules:   # Baseline A 7.1, bảng ánh xạ nguyên nhân sang hành động
      - {id: A01_floor_from_L2, priority: 1, when: "l2.rule_id == 'D08_tenant_history_high_risk'", then: {action_expr: "pick_floor_action(l2.floor_action_by_phase[phase], effective_actions)", explore: false}}
      - {id: A02_logistics, priority: 2, when: "dominant_cause == 'LOGISTICS_FAILURE'", then: {candidates: {1: [ALLOW], 2: [ALLOW], 3: [ALLOW]}, greedy_by_phase: {1: ALLOW, 2: ALLOW, 3: ALLOW}, contact_buyer: false, seller_alert: "rủi ro phía hãng hoặc khu vực, cân nhắc đổi hãng"}}
      - {id: A03_bad_address, priority: 3, when: "dominant_cause == 'RTO_BAD_ADDRESS'", then: {candidates: {1: [ALLOW, CONFIRM], 2: [ALLOW, CONFIRM], 3: [ALLOW, CONFIRM]}, greedy_by_phase: {1: CONFIRM, 2: CONFIRM, 3: CONFIRM}, variant: ADDRESS_FIX}}
      - {id: A04_unreachable, priority: 4, when: "dominant_cause == 'RTO_UNREACHABLE'", then: {candidates: {1: [ALLOW, CONFIRM], 2: [ALLOW, CONFIRM, CALL], 3: [ALLOW, CONFIRM, CALL]}, greedy_by_phase: {1: CONFIRM, 2: CALL, 3: EV}, call_no_answer_fallback: CONFIRM}}
      - {id: A05_refusal, priority: 5, when: "dominant_cause == 'RTO_REFUSAL'", then: {candidates: {1: [ALLOW, CONFIRM], 2: [ALLOW, CONFIRM, CALL], 3: [CONFIRM, CALL, DEPOSIT]}, greedy_by_phase: {1: CONFIRM, 2: CONFIRM, 3: EV}}}
      - {id: A06_none, priority: 6, when: "dominant_cause == 'NONE'", then: {candidates: {1: [ALLOW], 2: [ALLOW, CONFIRM], 3: [ALLOW, CONFIRM]}, greedy_by_phase: {1: ALLOW, 2: ALLOW, 3: EV}}}   # CONFIRM chỉ qua thăm dò
    selection:   # chạy theo thứ tự; A01 có action_expr thì bỏ qua greedy
      - {step: candidate_set, expr: "[a for a in candidates[phase] if a in effective_actions]"}
      - {step: target, expr: "ev_argmax(A) if greedy_by_phase[phase] == 'EV' else greedy_by_phase[phase]"}
      - step: greedy_with_cost_gate
        expr: "'CALL' if (t == 'CALL' and 'CALL' in A and loss_gate >= cost_CALL) else ('CONFIRM' if (t in ['CALL', 'CONFIRM'] and 'CONFIRM' in A and loss_gate >= cost_CONFIRM) else ('REVIEW' if (t in ['CALL', 'CONFIRM'] and 'CONFIRM' not in A and 'REVIEW' in effective_actions and loss_gate >= cost_REVIEW) else ('DEPOSIT' if (t == 'DEPOSIT' and 'DEPOSIT' in A) else 'ALLOW')))"
        doc: "t là kết quả bước target; đơn từ sàn không có CONFIRM nên rủi ro cao sẽ thành REVIEW"
      - {step: uncertain_high_value, when: "decision_uncertain and order.total >= c.high_value_order and a_greedy == 'ALLOW' and 'REVIEW' in effective_actions", then: {a_greedy: REVIEW, explore: false}}
      - {step: exploration, ref: exploration}
      - {step: l1_mapping, ref: L1_compliance_contact_protection.output_mapping}
    phase_limits:   # ASSUMPTION; vượt thì nâng ngưỡng cổng chi phí
      1: {max_contact_share_daily: 0.5, review_queue_max_daily: 20}
      2: {max_call_share_daily: 0.15}
      3: {max_deposit_share_daily: 0.05}
    exploration:   # Baseline A 7.2
      enabled_expr: "phase_capabilities[phase]['exploration']"
      epsilon_expr: "tenant.exploration.epsilon"
      unit: phone_hash_in_tenant
      salt_scope: tenant
      experiment_id: "exp-2026Q4-preship-apac-v1"
      A_explore_expr: "sorted(set([a for p in phase_capabilities[phase]['exploration_pairs'] if a_greedy in p for a in p if a in effective_actions]))"
      excluded_expr: "not exploration_enabled or a_greedy in ['DEPOSIT', 'REVIEW'] or l2.exploration_allowed == False or order.seller_priority_customer or not seller_segment_allowed() or order.total >= c.high_value_order or len(A_explore) < 2"
      explore_expr: "(not excluded) and unit_uniform('gate') < epsilon"
      a_final_expr: "A_explore[int(unit_uniform('arm') * len(A_explore))] if explore else a_greedy"
      propensity_expr: "1.0 if excluded else ((1 - epsilon) * (1 if a_final == a_greedy else 0) + epsilon / len(A_explore))"
      doc: "Không bao giờ thăm dò DEPOSIT hay hủy đơn. Khi excluded: propensity = 1.0"
      log_fields: [experiment_id, unit_id_hash, explore, excluded, a_greedy, a_final, propensity, A_explore]

  - id: L4_post_interaction_table
    order: 4
    hit_policy: FIRST
    principle: "Không chạy lại mô hình rủi ro; bảng tất định trên đầu ra nhiều chiều hoặc sự kiện nút (Baseline A)"
    field_priority:   # thứ tự ưu tiên trường → rule xử lý, đúng thứ tự rules bên dưới
      verified_cancel: [P01]
      recording_consent: [P13]
      cancel_intent: [P02]
      identity: [P03]
      address_change: [P04, P05]
      delivery_time: [P06]
      payment_change: [P07, P08]
      confirm_intent: [P09, P10]
      no_response: [P11, P12]
    rules:
      - {id: P01_verified_cancel, when: "event.verified and event.type in ['CANCEL_CONFIRMED', 'NOT_ORDERED'] and state in PRE_PICKUP_STATES", then: {state: CANCELLED, cancelled_by: BUYER, tenant_block_days_expr: "tenant.timeouts.not_ordered_block_days if event.type == 'NOT_ORDERED' else 0"}}
      - {id: P13_recording_declined, when: "event.source == 'AGENT' and out.recording_consent == 'DECLINED'", then: {end_call: true, discard_recording: true, state_expr: "'AWAIT_CONFIRM' if ('CONFIRM' in effective_actions and not confirm_sent_for_order) else 'PENDING_REVIEW'"}}
      - {id: P02_agent_cancel, when: "event.source == 'AGENT' and out.intent in ['CANCEL', 'NOT_ORDERED']", then: {state: AWAIT_CANCEL_CONFIRM, send: CANCEL_CONFIRM_BUTTON}}   # agent không được hủy
      - {id: P03_identity, when: "event.source == 'AGENT' and out.identity in ['WRONG_PERSON', 'UNKNOWN']", then: {state: PENDING_REVIEW}}
      - id: P04_address_change                # không chạy lại mô hình
        when: "(event.source == 'AGENT' and out.address_change.status == 'PROVIDED') or (event.verified and event.type == 'ADDRESS_EDITED')"
        then:
          run: deterministic_address_check
          state_expr: "'CLEARED_TO_SHIP' if address_check_valid else ('AWAIT_CONFIRM' if address.fix_attempts < tenant.thresholds.address_fix_max_attempts else 'PENDING_REVIEW')"
          side_effects: [increment_address_fix_attempts_if_invalid]
          carry_delivery_time: true
      - {id: P05_address_unclear, when: "event.source == 'AGENT' and out.address_change.status == 'NEEDS_CLARIFICATION'", then: {state: AWAIT_CONFIRM, variant: ADDRESS_FIX}}
      - {id: P06_reschedule, when: "event.source == 'AGENT' and out.delivery_time.status == 'NEW_SLOT'", then: {state_expr: "'DEFERRED' if hours_until(out.delivery_time.slot_start) <= tenant.timeouts.defer_max_hours else 'PENDING_REVIEW'", deferred_reason: BUYER_SLOT, resume_to: CLEARED_TO_SHIP}}
      - {id: P07_wants_prepay, when: "event.source == 'AGENT' and out.payment_change == 'WANTS_PREPAY'", then: {send: OFFICIAL_PAYMENT_LINK, rail_expr: "country.payments.deposit_rail", state: AWAIT_DEPOSIT}}
      - {id: P08_deposit_paid, when: "event.type == 'PAYMENT_CONFIRMED' and event.source == 'PAYMENT_GATEWAY'", then: {state: CLEARED_TO_SHIP, update_cod_amount_expr: "max(order.cod_amount - event.amount, 0)"}}
      - {id: P09_confirm, when: "(event.verified and event.type == 'CONFIRMED') or (event.source == 'AGENT' and out.intent == 'CONFIRM' and out.confidence >= tenant.thresholds.agent_confidence_min)", then: {state: CLEARED_TO_SHIP, tenant_trust_days_expr: "tenant.timeouts.trust_after_confirm_days"}}
      - {id: P10_undecided, when: "event.source == 'AGENT' and (out.intent in ['UNDECIDED', 'UNKNOWN'] or out.confidence < tenant.thresholds.agent_confidence_min)", then: {state: PENDING_REVIEW}}
      - id: P11_call_no_answer                # Baseline A 7.1: không nghe máy thì CONFIRM
        when: "event.type == 'CALL_NO_ANSWER' or (event.source == 'AGENT' and out.intent == 'NO_ANSWER')"
        then: {state_expr: "'AWAIT_CALL' if call_attempts_order < tenant.timeouts.call_max_attempts_per_order else ('AWAIT_CONFIRM' if ('CONFIRM' in effective_actions and not confirm_sent_for_order) else 'DEFAULT_APPLIED')"}
      - {id: P12_deadline, when: "event.type == 'DEADLINE_REACHED'", then: {state: DEFAULT_APPLIED, target_state_expr: "tenant.default_on_no_response_state[dominant_cause]"}}

  - id: S01_ship_cutoff
    order: 5
    hit_policy: FIRST
    doc: "Áp khi đơn vừa vào CLEARED_TO_SHIP; không đổi trạng thái, chỉ đặt ngày lấy hàng theo giờ của kho"
    rules:
      - {id: S01_after_cutoff, when: "warehouse_local_hm >= country.logistics.ship_cutoff_local", then: {planned_pickup: NEXT_BUSINESS_DAY, seller_notice: "đơn duyệt sau giờ cutoff"}}
      - {id: S02_before_cutoff, when: "True", then: {planned_pickup: TODAY}}

checkout_admission:   # Baseline A 1.4 và bảng hành động; chỉ khi đơn chưa tạo
  enabled_when_expr: "phase >= 3 and order.sales_channel == 'INDEPENDENT' and tenant.checkout.payment_step_integrated"
  evidence: "giỏ hàng, SĐT, địa chỉ đang nhập, lịch sử SĐT trong shop"
  hit_policy: FIRST
  rules:
    - {id: K01_require_prepaid, when: "tenant.checkout.require_prepaid_enabled and tenant.checkout.require_prepaid_min_loss is not None and loss_gate >= tenant.checkout.require_prepaid_min_loss", then: {action: REQUIRE_PREPAID, rail_expr: "country.payments.deposit_rail"}}
    - {id: K02_nudge_prepaid, when: "loss_gate >= cost_CONFIRM", then: {action: NUDGE_PREPAID, rail_expr: "country.payments.deposit_rail"}}
    - {id: K03_allow_cod, when: "True", then: {action: ALLOW_COD}}

state_machine:
  hit_policy: FIRST                        # transitions cùng from+event: dòng đầu tiên có guard đúng sẽ thắng
  idempotency: {key: "sha256(tenant_id+order_id+event_type+event_source_id)", dedupe_window_hours: 72, on_duplicate: ignore_and_log}
  on_enter:
    AWAIT_CONFIRM: [send_confirm_via_confirm_channel, start_timer_reminder, start_timer_deadline]
    AWAIT_CALL: [schedule_call_via_L1]
    AWAIT_DEPOSIT: [send_payment_link_country_rail, start_timer_deposit_deadline]
    AWAIT_CANCEL_CONFIRM: [send_cancel_confirm_button, start_timer_cancel_ttl]
    PENDING_REVIEW: [start_timer_review_sla, notify_seller]
    CLEARED_TO_SHIP: [run_S01_ship_cutoff]
    DEFAULT_APPLIED: [resolve_default]
  default_resolution:
    doc: "DEFAULT_APPLIED không đứng yên. Nguồn đích theo thứ tự: target_state từ P12; hành động từ fallbacks; còn lại PENDING_REVIEW"
    rules:
      - {when: "default_target_state is not None", to_expr: "default_target_state"}
      - {when: "default_action == 'ALLOW'", to: CLEARED_TO_SHIP}
      - {when: "default_action == 'CONFIRM'", to: AWAIT_CONFIRM}
      - {when: "default_action == 'REVIEW'", to: PENDING_REVIEW}
      - {when: "True", to: PENDING_REVIEW}
  transitions:
    - {from: NEW, event: ORDER_CREATED, to: SCORING}
    - {from: SCORING, event: DECIDED_ALLOW, to: CLEARED_TO_SHIP}
    - {from: SCORING, event: DECIDED_CONFIRM, to: AWAIT_CONFIRM}
    - {from: SCORING, event: DECIDED_CALL, to: AWAIT_CALL, guard: "'CALL' in effective_actions"}
    - {from: SCORING, event: DECIDED_DEPOSIT, to: AWAIT_DEPOSIT, guard: "'DEPOSIT' in effective_actions"}
    - {from: SCORING, event: DECIDED_REVIEW, to: PENDING_REVIEW}
    - {from: SCORING, event: CONTACT_DEFERRED, to: DEFERRED}
    - {from: SCORING, event: MODEL_ERROR, to: DEFAULT_APPLIED}
    - {from: AWAIT_CONFIRM, event: TIMER_REMINDER, to: AWAIT_CONFIRM, side_effects: [one_reminder_if_window_open]}
    - {from: AWAIT_CONFIRM, event: TIMER_DEADLINE, to: AWAIT_CALL, guard: "'CALL' in effective_actions and dominant_cause == 'RTO_UNREACHABLE'", demo_transition_if: "phase == 1"}
    - {from: AWAIT_CONFIRM, event: TIMER_DEADLINE, to: DEFAULT_APPLIED, side_effects: [emit_DEADLINE_REACHED_to_L4]}
    - {from: AWAIT_CALL, event: CALL_ATTEMPTS_EXHAUSTED, to: L4_post_interaction_table}
    - {from: [AWAIT_CONFIRM, AWAIT_CALL, AWAIT_DEPOSIT, AWAIT_CANCEL_CONFIRM, DEFERRED, PENDING_REVIEW, CLEARED_TO_SHIP], event: BUYER_EVENT, to: L4_post_interaction_table, guard: "state != 'CLEARED_TO_SHIP' or not carrier_picked_up"}
    - {from: AWAIT_CANCEL_CONFIRM, event: TIMER_CANCEL_TTL, to: PENDING_REVIEW}   # không tự hủy
    - {from: AWAIT_DEPOSIT, event: TIMER_DEPOSIT_DEADLINE, to: PENDING_REVIEW}
    - {from: DEFERRED, event: SLOT_REACHED, to: CLEARED_TO_SHIP, guard: "deferred_reason == 'BUYER_SLOT'"}
    - {from: DEFERRED, event: WINDOW_OPEN, to_expr: "'AWAIT_' + resume_action if resume_action in ['CONFIRM', 'CALL', 'DEPOSIT'] else 'PENDING_REVIEW'", guard: "deferred_reason == 'CONTACT_WINDOW'", doc: "thực thi lại hành động đã chọn, KHÔNG chấm lại"}
    - {from: DEFERRED, event: DEFER_EXPIRED, to: PENDING_REVIEW}
    - {from: PENDING_REVIEW, event: REVIEW_SLA_BREACH, to: PENDING_REVIEW, side_effects: [renotify_seller]}
    - {from: CLEARED_TO_SHIP, event: CARRIER_PICKED_UP, to: SHIPPED}
    - {from: SHIPPED, event: CARRIER_DELIVERED, to: DELIVERED}
    - {from: SHIPPED, event: CARRIER_FAILED_ATTEMPT, to: NDR, side_effects: [start_ndr_recovery]}
    - {from: NDR, event: CARRIER_DELIVERED, to: DELIVERED}
    - {from: NDR, event: CARRIER_RTO_COMPLETED, to: RTO}
  cross_state_events:
    - {event: SELLER_OVERRIDE, to_expr: "override.target_state", guard: "state not in ['DELIVERED', 'RTO', 'CANCELLED']", require: written_reason, log: human_decision_log}
    - {event: ORDER_FULLY_PREPAID, to: CLEARED_TO_SHIP, guard: "state not in ['SHIPPED', 'NDR', 'DELIVERED', 'RTO', 'CANCELLED']"}
    - {event: SELLER_CANCEL, to: CANCELLED, guard: "state not in ['SHIPPED', 'NDR', 'DELIVERED', 'RTO', 'CANCELLED']"}
  late_events:
    - {event: BUTTON_CONFIRMED, in_state: [DEFAULT_APPLIED], to: CLEARED_TO_SHIP}
    - {event: BUTTON_CANCEL_CONFIRMED, in_state: [SHIPPED, NDR], to: same, side_effects: [notify_seller_late_cancel]}
    - {event: ANY_BUYER_OR_AGENT_EVENT, in_state: [CANCELLED, DELIVERED, RTO], to: same, side_effects: [log_only]}
    - {event: CARRIER_WEBHOOK_OUT_OF_ORDER, guard: "event.event_time > last_applied_event_time", doc: "cũ hơn sự kiện đã áp thì chỉ ghi log"}

ndr_recovery:
  trigger: "webhook hoặc CSV của hãng: giao thất bại, chưa chuyển hoàn"
  compliance: "mọi liên hệ NDR đi qua L1 với country pack như đơn thường"
  reason_map_ref_expr: "country.logistics.ndr_reason_map_ref"   # ASSUMPTION: mỗi hãng một bảng mã
  reason_groups: [BUYER_REFUSED, BUYER_UNREACHABLE, ADDRESS_ISSUE, RESCHEDULE, CARRIER_ISSUE]
  hit_policy: FIRST
  rules:
    - {id: N01_carrier_issue, when: "ndr_group == 'CARRIER_ISSUE'", then: {action: REATTEMPT, contact_buyer: false, seller_alert: true}}
    - {id: N02_verified_cancel, when: "event.verified and event.type == 'CANCEL_CONFIRMED'", then: {action: REQUEST_RTO, auto_rto: true}}
    - {id: N03_agent_cancel, when: "event.source == 'AGENT' and out.intent in ['CANCEL', 'NOT_ORDERED']", then: {state: AWAIT_CANCEL_CONFIRM, send: CANCEL_CONFIRM_BUTTON}}
    - {id: N04_reattempt, when: "(event.verified and event.type in ['REATTEMPT_TOMORROW', 'PICK_SLOT']) or edited_address_valid", then: {action: REATTEMPT}}
    - {id: N05_call, when: "minutes_since(ndr_contact_sent_at) >= tenant.timeouts.ndr_call_after_minutes and 'CALL' in effective_actions and ndr_call_attempts < tenant.timeouts.call_max_attempts_per_order", then: {action: NDR_CALL}}
    - {id: N06_no_response_deadline, when: "carrier_deadline_reached", then: {action: RECOMMEND_RTO, auto_rto: false, decide: seller}}
    - {id: N07_first_contact, when: "ndr_contact_sent_at is None", then: {action: NDR_CONFIRM, buttons: [REATTEMPT_TOMORROW, PICK_SLOT, EDIT_ADDRESS, CANCEL], within_minutes_expr: "tenant.timeouts.ndr_first_contact_minutes"}}
    - {id: N08_wait, when: "True", then: {action: WAIT}}
  limits_expr: "{'seller_action_sla_hours': 24, 'max_reattempts': country.logistics.max_delivery_attempts_default - 1}"   # ASSUMPTION
  labeling: "Chỉ kết quả cuối (DELIVERED hoặc RTO kèm lý do đã ánh xạ) là nhãn"

fallbacks:   # kết quả đều vào DEFAULT_APPLIED → default_resolution
  model_error_or_timeout:
    when: "model_latency_ms > tenant.timeouts.model_timeout_ms or model_status != 'OK'"
    hit_policy: FIRST
    rules:
      - {when: "l2.cause in ['RTO_BAD_ADDRESS', 'DUPLICATE', 'RTO_REFUSAL']", default_action: CONFIRM}
      - {when: "order.total >= c.high_value_order", default_action: CONFIRM}
      - {when: "True", default_action: ALLOW}
    log: {fallback_reason: MODEL_UNAVAILABLE, propensity: 1.0, explore: false}
  explanation_renderer_error: {when: "gemini_error or gemini_quota_exceeded", then: {reasons_source: TEMPLATE_BY_SIGNAL_CODE, decision_changed: false}}
  agent_error_or_quota:
    when: "gemini_live_error or quota_exceeded or call_provider_down"
    hit_policy: FIRST
    rules:
      - {when: "not confirm_sent_for_order", default_action: CONFIRM}
      - {when: "True", default_action: REVIEW}
  messaging_provider_down: {when: "len(l1.removed_channels) >= len(country.channels.enabled)", default_action: REVIEW}
  missing_data:
    hit_policy: FIRST
    rules:
      - {when: "phone.e164 is None", default_action: REVIEW}
      - {when: "address.raw is None and phone.valid", default_action: CONFIRM, variant: ADDRESS_FIX}
      - {when: "tenant_labeled_orders < 50", mode: L2_PLUS_VALUE_GATE, doc: "bỏ qua mô hình; L2 rồi CONFIRM nếu đơn ≥ c.high_value_order, ngược lại ALLOW"}   # ASSUMPTION
  outcome_missing:
    when: "state == 'SHIPPED' and days_since_shipped >= tenant.timeouts.outcome_wait_days and outcome is None"
    then: {outcome: OUTCOME_UNKNOWN, is_label: false, treat_as: CENSORED}

agent_output_contract:   # Agent Hội thoại chỉ trả JSON đúng schema; Policy Engine quyết định
  schema_version: "1.1"
  required: [order_id, interaction_id, channel, language, identity, intent, confidence, evidence]
  fields:
    channel: {enum: [AI_CALL, FREE_TEXT_REPLY]}
    language: {enum_expr: "country.languages"}
    recording_consent: {enum: [NOT_ASKED, GRANTED, DECLINED]}
    identity: {enum: [BUYER_CONFIRMED, RELATIVE_OR_PROXY, WRONG_PERSON, UNKNOWN]}
    intent: {enum: [CONFIRM, CANCEL, NOT_ORDERED, UNDECIDED, NO_ANSWER, UNKNOWN]}
    address_change: {status: {enum: [NONE, PROVIDED, NEEDS_CLARIFICATION]}, new_address_raw: "string|null"}
    delivery_time: {status: {enum: [NONE, NEW_SLOT]}, slot_start: "datetime|null", slot_end: "datetime|null"}
    payment_change: {enum: [NONE, WANTS_PREPAY]}
    call_window_preference: {enum: [NONE, EXTENDED_EVENING]}
    contact_opt_out: {enum: [NONE, CALLS, ALL]}
    confidence: {type: number, min: 0, max: 1}
    evidence: {type: array, items: {quote: string, t_start_s: number}}
    safety_flags: {type: array, items: {enum: [ASKED_FOR_MONEY, ASKED_FOR_OTP, PROMO_CONTENT, PROMISED_PROMOTION, OFFERED_OTHER_PRODUCT, ABUSIVE, RECORDED_WITHOUT_CONSENT]}}
  validation:
    on_schema_error: {replace_with: {intent: UNKNOWN, identity: UNKNOWN, confidence: 0}, then: "L4 → P03 → PENDING_REVIEW"}
    on_safety_flag: {end_call: true, state: PENDING_REVIEW, log: incident_log, notify: [seller, ops]}
    on_contact_opt_out: {CALLS: "set buyer_opted_out_calls_tenant", ALL: "set buyer_opted_out_all_tenant"}

logging:
  common_fields: [log_id, tenant_id, order_id, phone_hash_tenant_salted, ts, rule_set_version, model_version, effective_phase, country, contact_packs, buyer_timezone, sales_channel, idempotency_key, demo_exception]
  decision_log: [workflow, decision_step, go_live_missing, l1_constraints, l2_rule_id, l2_cause, dominant_cause, probs, loss_gate, cost_by_action, uncertainty, candidates, a_greedy, a_final, executed, propensity, explore, excluded, experiment_id, fallback_reason, reason_codes, rendered_reasons]
  human_decision_log: {fields: [actor_id, actor_role, from_state, to_state, action, written_reason, decision_log_ref], is_label: false}
  outcome_log: {fields: [carrier, awb, outcome, carrier_reason_raw, buyer_caused, cancelled_by, event_time, source], is_label: true}
  interaction_log: {fields: [interaction_id, channel, template_id, language, sent_at, button_event, agent_output_json, recording_consent, transcript_ref, call_duration_s, cost_local, currency, compliance_checks_passed], retention_days: 180}   # ASSUMPTION; mỗi nước có thể yêu cầu khác
  incident_log: {fields: [interaction_id, safety_flags, transcript_ref, handled_by]}
  labeling_rules:
    - "Nhãn chỉ từ outcome_log"
    - "Ghi đè của người bán là quyết định chính sách của con người, lưu cho kiểm toán, không phải nhãn đúng"
    - "Diễn giải của agent và DEFAULT_APPLIED không phải nhãn"
    - "Đơn chưa có kết quả là dữ liệu bị cắt (censored), không gán là giao thành công"
    - "Đặc trưng tại thời điểm t chỉ dùng thông tin có trước t"
    - "Đánh giá chính sách bằng IPS hoặc doubly robust với propensity đã log"
    - "Không resampling hay SMOTE; hiệu chỉnh xác suất"

measurement:   # Baseline A mục 9
  primary: "lợi nhuận ròng trên mỗi đơn so với nhóm đối chứng, tính riêng từng nước"
  secondary: [outcome_rate_by_taxonomy, intervention_cost_per_order, calibration_brier_and_reliability, call_blocked_rate, missed_cutoff_rate]
  fairness: {metrics: [intervention_rate, error_rate], by: [country, region, language]}
  not_standalone: "tỷ lệ bỏ đơn do can thiệp, vì không phân biệt khách tốt bị mất với người bom hàng bị chặn"
  cross_country_note: "so sánh giữa các nước bằng tỷ lệ trên giá trị đơn; không cộng tiền khác đơn vị"

data_isolation:
  default: tenant_isolated
  phone_hash: "HMAC-SHA256(tenant_secret, E.164); SĐT đã băm vẫn coi là dữ liệu cá nhân ở mọi nước"
  features:   # tất cả cần pháp chế của từng nước duyệt
    cross_tenant_phone_history: {enabled: false, requires_legal_approval: true}
    cross_tenant_not_ordered_block: {enabled: false, requires_legal_approval: true}
    global_contact_cap: {enabled: false, requires_legal_approval: true}
    pooled_model_training: {enabled: false, requires_legal_approval: true}
    cross_country_pooling: {enabled: false, requires_legal_approval: true, note: "gộp dữ liệu nhiều nước để train cần căn cứ chuyển dữ liệu của từng nước"}
    aggregated_priors_small_tenants: {enabled: false, requires_legal_approval: true, if_denied: "tenant nhỏ dừng ở pha 1"}
  forbidden: ["mua bán dữ liệu cá nhân", "dùng dữ liệu cho quảng cáo"]

