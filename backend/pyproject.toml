[project]
name = "codguard-backend"
version = "0.1.0"
description = "COD Guard API: COD order risk scoring, decisions and buyer verification"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "evidently>=0.7.23",
    "fastapi>=0.115",
    "google-adk>=2.11,<3",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.9",
    "pyjwt>=2.10",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "shap>=0.53,<1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "openapi-spec-validator>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=1.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Security", "fastapi.Depends", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["default_automation: run with the real default automation (suggest), not automation on"]
